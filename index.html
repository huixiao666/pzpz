<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Telegram · 交互式聊天</title>
<style>
  /* ================= 设计令牌 ================= */
  :root {
    --c-accent:      #3390ec;
    --c-accent-hover:#2b7fd4;

    --bg-app:        #fff;
    --bg-side:       #fff;
    --bg-chat:       #e3e9ef;
    --bg-header:     #fff;
    --bg-fill:       #f1f3f5;
    --bg-hover:      #f1f3f5;
    --bg-item-hover: #f4f6f8;
    --bg-item-active:#3390ec;

    --tx-main:       #0f1720;
    --tx-muted:      #7c8894;
    --tx-faint:      #98a4b1;
    --tx-on-accent:  #fff;

    --bd-line:       #e6e9ec;

    --bub-in:        #fff;
    --bub-out:       #eeffde;
    --bub-shadow:    0 1px 2px rgba(16, 35, 47, .14);
    --tick-read:     #4fae4e;

    --page-bg:       #0e1621;
    --page-radial-1: #1c2f42;
    --page-radial-2: #16283c;
    --app-shadow:    0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255,255,255,.05);

    --avatar-c1:     #7f7fd5;
    --avatar-c2:     #86a8e7;

    --scroll-thumb:  rgba(0, 0, 0, .15);
    --scroll-thumb-h:rgba(0, 0, 0, .3);

    --radius-app:    14px;
    --radius-item:   10px;
    --radius-bubble: 12px;
    --radius-pill:   22px;

    --dur-fast:      .13s;
    --dur-base:      .15s;
    --dur-slow:      .22s;
    --ease:          cubic-bezier(.4, 0, .2, 1);
  }

  /* ================= 基础重置 ================= */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-size-adjust: 100%;
    color: var(--tx-main);
    background: var(--page-bg);
    background-image:
      radial-gradient(circle at 15% 0%, var(--page-radial-1) 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, var(--page-radial-2) 0%, transparent 55%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; padding: 0; }
  input  { font: inherit; }
  a { color: inherit; }

  /* 统一焦点样式：仅在键盘导航时出现 */
  :focus-visible {
    outline: 2px solid var(--c-accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  :focus:not(:focus-visible) { outline: none; }

  /* 统一滚动条 */
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  .scroll-thin::-webkit-scrollbar { width: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-h); }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }

  .app {
    width: min(1220px, 100%);
    height: min(820px, calc(100vh - 48px));
    height: min(820px, calc(100dvh - 48px));
    display: flex;
    background: var(--bg-app);
    border-radius: var(--radius-app);
    overflow: hidden;
    box-shadow: var(--app-shadow);
  }

  /* ================= 侧边栏 ================= */
  .sidebar {
    width: 356px;
    flex: 0 0 356px;
    display: flex;
    flex-direction: column;
    background: var(--bg-side);
    border-right: 1px solid var(--bd-line);
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    height: 60px;
    flex: 0 0 60px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #707d8b;
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
    flex: 0 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover  { background: var(--bg-hover); }
  .icon-btn:active { background: #e6e9ec; transform: scale(.94); }

  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-fill);
    border-radius: var(--radius-pill);
    padding: 0 14px;
    height: 42px;
    color: var(--tx-faint);
    transition: background var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .search:focus-within {
    background: var(--bg-app);
    box-shadow: 0 0 0 2px var(--c-accent) inset;
    color: var(--c-accent);
  }
  .search input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    font-size: 14.5px;
    color: var(--tx-main);
    min-width: 0;
  }
  .search input::placeholder { color: var(--tx-faint); }

  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }

  /* ================= 会话分类筛选栏 ================= */
  .cat-bar {
    display: flex;
    gap: 6px;
    padding: 2px 12px 8px;
    overflow-x: auto;
    flex: 0 0 auto;
    /* 显式保留横向滚动条：12 个分类会超出宽度，
       之前把滚动条藏起来导致「看不出还能横向滑动」 */
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    /* 滚动条已可见，无需再用渐隐遮罩暗示可滑动 */
    -webkit-mask-image: none;
    mask-image: none;
  }
  .cat-bar::-webkit-scrollbar { height: 6px; }
  .cat-bar::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 3px;
  }
  .cat-bar::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-h); }
  .cat-bar::-webkit-scrollbar-track { background: transparent; }
  .cat-chip {
    flex: 0 0 auto;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    background: var(--bg-fill);
    color: var(--tx-muted);
    font-size: 13px;
    line-height: 1.5;
    white-space: nowrap;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease),
                transform var(--dur-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .cat-chip:hover  { background: var(--bg-hover); color: var(--tx-main); }
  .cat-chip:active { transform: scale(.95); }
  .cat-chip[aria-selected="true"] {
    background: var(--c-accent);
    color: #fff;
    font-weight: 600;
  }
  .cat-chip .cat-n {
    margin-left: 5px;
    font-size: 11.5px;
    opacity: .75;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 10px;
    border-radius: var(--radius-item);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-item:hover  { background: var(--bg-item-hover); }
  .chat-item.active { background: var(--bg-item-active); }
  .chat-item.active .ci-name,
  .chat-item.active .ci-time,
  .chat-item.active .ci-msg { color: var(--tx-on-accent); }
  .chat-item.active .ci-msg { color: rgba(255, 255, 255, .85); }
  .chat-item.active .badge  { background: var(--tx-on-accent); color: var(--c-accent); }

  .avatar {
    position: relative;
    width: 46px; height: 46px;
    flex: 0 0 46px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--tx-on-accent);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .5px;
    background: linear-gradient(135deg, var(--avatar-c1), var(--avatar-c2));
    user-select: none;
    overflow: hidden;
  }
  /* 有头像图时，图完全覆盖首字母底色 */
  .avatar.has-photo { background: #dfe6ec; }
  .avatar-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;   /* 人像偏上，避免把脸裁掉 */
    display: block;
  }
  .avatar.has-photo.load-failed { background: linear-gradient(135deg, var(--avatar-c1), var(--avatar-c2)); }
  .ci-main { flex: 1; min-width: 0; }
  .ci-top {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 3px;
  }
  .ci-name {
    font-size: 15px; font-weight: 600; color: var(--tx-main);
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ci-time { font-size: 12px; color: var(--tx-faint); flex: 0 0 auto; }
  .ci-bottom { display: flex; align-items: center; gap: 8px; }
  .ci-msg {
    flex: 1; min-width: 0;
    font-size: 13.5px;
    color: var(--tx-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    flex: 0 0 auto;
    min-width: 20px; height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: var(--c-accent);
    color: var(--tx-on-accent);
    font-size: 12px;
    font-weight: 600;
    display: grid; place-items: center;
  }
  .empty-tip {
    padding: 28px 12px;
    text-align: center;
    color: var(--tx-faint);
    font-size: 14px;
  }

  /* ================= 聊天主区 ================= */
  .chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
    position: relative;
  }
  /* 背景层（渐变 + 图案）挂在 .chat 上，绝对定位覆盖聊天区。
     它们不在滚动容器 .chat-body 内部，所以滚动内容时纹丝不动，
     渐变始终完整呈现 0%→100%，不会出现「上下两截」的割裂感。 */
  .chat-bg {
    position: absolute;
    /* 顶部让开聊天头栏（60px），底部让开输入区，正好盖住滚动区 */
    top: 60px;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background-color: var(--chat-c1, var(--bg-chat));
    background-image: linear-gradient(160deg,
        var(--chat-c1, var(--bg-chat)) 0%,
        var(--chat-c2, var(--bg-chat)) 45%,
        var(--chat-c3, var(--bg-chat)) 100%);
  }
  .chat-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--chat-pattern, none);
    background-size: var(--chat-pat-size, 420px auto);
    background-repeat: repeat;
    opacity: var(--chat-pat-opacity, .15);
    /* mix-blend-mode 让同一张「深色描边」图案在任意底色上都呈现为白色描边 */
    mix-blend-mode: var(--chat-pat-blend, screen);
  }

  .chat-header {
    flex: 0 0 60px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 12px 0 14px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--bd-line);
    z-index: 5;
  }
  .chat-header .avatar { width: 42px; height: 42px; flex: 0 0 42px; font-size: 15px; }
  .peer { flex: 1; min-width: 0; }
  .peer-name {
    font-size: 15.5px; font-weight: 600; color: var(--tx-main);
    line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .peer-status { font-size: 13px; color: var(--c-accent); line-height: 1.25; }
  .peer-status.offline { color: var(--tx-faint); }
  .header-actions { display: flex; gap: 2px; }
  .back { display: none; }

  .chat-body {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding: 18px clamp(12px, 5%, 64px) 14px;
    background: transparent;
    isolation: isolate;
  }
  .chat-body > * { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) {
    .chat-body { scroll-behavior: auto; }
  }

  .date-divider { display: flex; justify-content: center; margin: 6px 0 14px; }
  .date-divider span {
    background: rgba(0, 0, 0, .22);
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    padding: 3px 11px;
    border-radius: 13px;
    backdrop-filter: blur(4px);
  }

  .msg { display: flex; margin-bottom: 5px; }
  .msg.anim { animation: pop .22s var(--ease) both; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  .msg.in  { justify-content: flex-start; }
  .msg.out { justify-content: flex-end; }

  .bubble {
    position: relative;
    max-width: min(62%, 520px);
    padding: 7px 11px 8px;
    border-radius: var(--radius-bubble);
    font-size: 14.6px;
    line-height: 1.38;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    box-shadow: var(--bub-shadow);
  }
  .msg.in  .bubble { background: var(--bub-in);  border-bottom-left-radius: 4px; }
  .msg.out .bubble { background: var(--bub-out); border-bottom-right-radius: 4px; }

  .bubble::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 8px;
    height: 14px;
  }
  .msg.in .bubble::after {
    left: -7px; background: var(--bub-in);
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
  .msg.out .bubble::after {
    right: -7px; background: var(--bub-out);
    clip-path: polygon(0 0, 100% 100%, 0 100%);
  }

  .bubble .sender {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--c-accent);
    margin-bottom: 2px;
  }
  .bubble .text { display: inline; white-space: pre-wrap; }
  .bubble .meta {
    float: right;
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 7px 0 -3px 9px;
    font-size: 11px;
    line-height: 1;
    color: #9aa9b7;
    white-space: nowrap;
    user-select: none;
  }
  .ticks { color: #b4c0cc; display: block; }
  .ticks.read { color: var(--tick-read); }

  /* ---- 文件 ---- */
  .bubble.file { padding: 10px 12px; }
  .file-card { display: flex; align-items: center; gap: 10px; min-width: 210px; }
  .file-icon {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    border-radius: 9px;
    background: var(--c-accent);
    color: var(--tx-on-accent);
    display: grid; place-items: center;
    font-size: 19px;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 14px; font-weight: 600; color: var(--tx-main);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-size { font-size: 12px; color: #8fa0b1; margin-top: 2px; }

  .file-link {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 8px;
    transition: background var(--dur-base) var(--ease);
  }
  .file-link:hover { background: rgba(0, 0, 0, .05); }
  .file-link:hover .file-name { color: var(--c-accent); }

  /* ---- 链接 ---- */
  .bubble.link { padding: 10px 12px; }
  .link-card { display: block; text-decoration: none; color: inherit; min-width: 210px; }
  .link-card:hover .link-title { color: var(--c-accent); }
  .link-title {
    font-size: 14px; font-weight: 600; color: var(--tx-main);
    margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color var(--dur-base) var(--ease);
  }
  .link-url { font-size: 12px; color: var(--c-accent); word-break: break-all; line-height: 1.3; }
  .link-preview {
    margin-top: 7px;
    padding: 7px 9px;
    border-radius: 7px;
    background: rgba(0, 0, 0, .05);
    font-size: 12px;
    color: #5b6a79;
    line-height: 1.35;
  }
  .msg.out .bubble.link .link-preview { background: rgba(0, 0, 0, .06); }

  /* ---- 图片 ---- */
  .bubble.photo {
    padding: 3px;
    overflow: hidden;
    line-height: 0;
  }
  .photo-link {
    display: block;
    border-radius: 10px;
    overflow: hidden;
    line-height: 0;
    background: rgba(0, 0, 0, .04);
  }
  .photo-img {
    display: block;
    width: 100%;
    max-width: 420px;
    height: auto;
    border-radius: 10px;
    transition: opacity var(--dur-slow) var(--ease), transform var(--dur-base) var(--ease);
    /* 未加载完成时的占位高度，避免加载瞬间布局跳动 */
    min-height: 40px;
    /* 预留 4:3 空间，图片解码前不再塌陷（首屏 CLS 主要来源） */
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: rgba(0, 0, 0, .04);
  }
  .photo-img.loaded { aspect-ratio: auto; object-fit: contain; }
  .photo-link:hover .photo-img { transform: scale(1.015); }
  .photo-img.loading { opacity: 0; }
  .photo-fallback {
    display: grid;
    place-items: center;
    gap: 6px;
    min-width: 220px;
    min-height: 130px;
    padding: 22px 18px;
    border-radius: 10px;
    background: rgba(0, 0, 0, .05);
    color: var(--tx-muted);
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    text-decoration: none;
  }
  .photo-fallback .pf-icon { font-size: 26px; line-height: 1; }
  .photo-fallback .pf-text { word-break: break-all; }

  /* ---- 图集（一条消息多图） ---- */
  .bubble.album {
    padding: 3px 3px 0;
    overflow: hidden;
    max-width: min(62%, 520px);
  }
  .album-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
    border-radius: 10px;
    overflow: hidden;
    line-height: 0;
    align-items: start;
  }
  /* 一横一竖时按比例分配宽度，观感更接近 Telegram */
  .album-grid.ratio-auto { grid-template-columns: 1.12fr 0.88fr; }
  /* 单张时占满整行，避免半宽留白 */
  .album-grid[data-count="1"] { grid-template-columns: 1fr; }

  .album-cell {
    position: relative;
    display: block;
    overflow: hidden;
    background: rgba(0, 0, 0, .04);
    line-height: 0;
    aspect-ratio: 4 / 3;
  }
  /* 竖图给更高的格子，避免被压扁/裁切 */
  .album-cell.portrait { aspect-ratio: 3 / 4; }

  .album-cell .photo-img {
    width: 100%;
    height: 100%;
    max-width: none;
    /* contain 保证整图完整可见；留白由格子背景填充，比裁掉内容好 */
    object-fit: contain;
    border-radius: 0;
    transition: opacity var(--dur-slow) var(--ease);
    min-height: 0;
  }
  .album-cell .photo-fallback {
    position: absolute;
    inset: 0;
    min-width: 0; min-height: 0;
    border-radius: 0;
    padding: 10px;
    font-size: 12px;
  }
  .album-cell .photo-fallback .pf-icon { font-size: 20px; }

  /* 图集说明文字 */
  .album-caption {
    padding: 7px 9px 6px;
    font-size: 13px;
    line-height: 1.35;
    color: var(--tx-main);
    word-break: break-word;
  }
  /* 图集里的时间戳：跟随说明文字右下角 */
  .bubble.album .meta { float: right; margin: 0 4px 0 9px; }

  /* ---- 语音 ---- */
  .bubble.voice {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px 7px 8px;
    min-width: 210px;
  }
  .voice-play {
    width: 38px; height: 38px;
    flex: 0 0 38px;
    border-radius: 50%;
    background: var(--c-accent);
    color: var(--tx-on-accent);
    display: grid; place-items: center;
    transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
  }
  .voice-play:hover  { background: var(--c-accent-hover); }
  .voice-play:active { transform: scale(.93); }
  .voice-wave {
    flex: 1; height: 22px;
    display: flex; align-items: center; gap: 2px;
    overflow: hidden;
  }
  .voice-wave i {
    display: block;
    width: 2px;
    border-radius: 1px;
    background: #9fb4c7;
    flex: 0 0 auto;
    transform-origin: center;
  }
  .bubble.voice.playing .voice-wave i { animation: wavePulse .9s ease-in-out infinite; }
  @keyframes wavePulse {
    0%, 100% { transform: scaleY(.45); }
    50%      { transform: scaleY(1); }
  }

  /* ---- 正在输入 ---- */
  .typing-row { margin-bottom: 2px; }
  .bubble.typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .bubble.typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #a9b7c4;
    animation: blink 1.3s infinite ease-in-out;
  }
  .bubble.typing span:nth-child(2) { animation-delay: .18s; }
  .bubble.typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-3px); }
  }

  /* ---- 回到底部 ---- */
  .scroll-bottom {
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-app);
    color: var(--tx-muted);
    display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(10, 30, 50, .22);
    opacity: 0;
    transform: translateY(10px) scale(.9);
    pointer-events: none;
    transition: opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease), color var(--dur-base) var(--ease);
    z-index: 20;
  }
  .scroll-bottom.show { opacity: 1; transform: none; pointer-events: auto; }
  .scroll-bottom:hover { color: var(--c-accent); }

  /* ================= 输入栏 ================= */
  .composer-wrap {
    flex: 0 0 auto;
    background: var(--bg-header);
    border-top: 1px solid var(--bd-line);
  }
  .composer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--bg-header);
  }
  .composer .icon-btn { color: #7d8b99; }
  .composer .icon-btn.active { background: #e9eef3; color: var(--c-accent); }

  .input-wrap {
    flex: 1;
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-fill);
    border-radius: var(--radius-pill);
    padding: 0 6px 0 16px;
    height: 44px;
    transition: box-shadow var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
  }
  .input-wrap:focus-within {
    background: var(--bg-app);
    box-shadow: 0 0 0 2px var(--c-accent) inset;
  }
  .input-wrap input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    font-size: 15px;
    color: var(--tx-main);
    min-width: 0;
  }
  .input-wrap input::placeholder { color: var(--tx-faint); }

  .emoji-btn {
    width: 34px; height: 34px;
    flex: 0 0 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--tx-faint);
    transition: color var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
  }
  .emoji-btn:hover,
  .emoji-btn.active { color: var(--c-accent); background: #e9eef3; }

  .send-btn {
    width: 46px; height: 46px;
    flex: 0 0 46px;
    border-radius: 50%;
    background: var(--c-accent);
    color: var(--tx-on-accent);
    display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(51, 144, 236, .4);
    transition: transform var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
  }
  .send-btn:hover  { background: var(--c-accent-hover); }
  .send-btn:active { transform: scale(.92); }

  /* ---- 表情面板 ---- */
  .emoji-panel {
    position: absolute;
    left: 14px; right: 14px;
    bottom: calc(100% - 4px);
    background: var(--bg-app);
    border: 1px solid var(--bd-line);
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(10, 30, 50, .2);
    padding: 10px;
    display: none;
    grid-template-columns: repeat(10, 1fr);
    gap: 2px;
    z-index: 30;
    max-height: 46vh;
    overflow-y: auto;
  }
  .emoji-panel.open { display: grid; }
  .emoji-panel button {
    font-size: 21px;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    display: grid; place-items: center;
    transition: background .12s var(--ease), transform .12s var(--ease);
  }
  .emoji-panel button:hover  { background: var(--bg-fill); }
  .emoji-panel button:active { transform: scale(.88); }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    left: 50%; bottom: 46px;
    transform: translate(-50%, 14px);
    background: rgba(18, 28, 38, .92);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease);
    z-index: 999;
    backdrop-filter: blur(6px);
    max-width: 80vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ================= 响应式 ================= */
  @media (max-width: 820px) {
    body { padding: 0; }
    .app { border-radius: 0; height: 100vh; height: 100dvh; width: 100%; }
    .sidebar { display: none; }
    .back { display: grid; }
    .bubble { max-width: 78%; }
    .emoji-panel { grid-template-columns: repeat(7, 1fr); }

    /* 返回会话列表时，全屏显示侧边栏，隐藏聊天区 */
    .app.show-sidebar .sidebar { display: flex; width: 100%; flex-basis: 100%; }
    .app.show-sidebar .chat    { display: none; }
  }

  /* ================= 夜间模式 ================= */
  body.dark {
    --bg-app:        #17212b;
    --bg-side:       #17212b;
    --bg-chat:       #0e1621;
    --bg-header:     #17212b;
    --bg-fill:       #242f3d;
    --bg-hover:      #232e3a;
    --bg-item-hover: #202b36;

    --tx-main:       #e6edf3;
    --tx-muted:      #8b98a5;
    --tx-faint:      #6f7c8a;

    --bd-line:       #0f171e;

    --bub-in:        #182533;
    --bub-out:       #2b5278;
    --bub-shadow:    0 1px 2px rgba(0, 0, 0, .35);

    --page-bg:       #0a0f16;
    --page-radial-1: #12202f;
    --page-radial-2: #0e1a27;
    --app-shadow:    0 30px 80px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);

    --scroll-thumb:  rgba(255, 255, 255, .18);
    --scroll-thumb-h:rgba(255, 255, 255, .3);

    color: var(--tx-main);
  }
  body.dark .icon-btn        { color: #8b98a5; }
  body.dark .icon-btn:active { background: #2b3744; }
  body.dark .search:focus-within { background: #2b3848; }
  body.dark .chat-item.active .badge { background: #fff; color: var(--c-accent); }

  body.dark .date-divider span { background: rgba(0, 0, 0, .4); color: #cfd8e2; }

  body.dark .bubble .meta        { color: #7d8b99; }
  body.dark .msg.out .bubble .meta { color: #9fb4c7; }
  body.dark .bubble .sender      { color: #7fb1e0; }

  body.dark .file-size           { color: #8fa0b1; }
  body.dark .file-link:hover     { background: rgba(255, 255, 255, .05); }
  body.dark .link-preview        { background: rgba(255, 255, 255, .06); color: #a9b8c6; }
  body.dark .msg.out .bubble.link .link-preview { background: rgba(255, 255, 255, .1); }

  body.dark .voice-wave i        { background: #5c7186; }
  body.dark .voice-dur           { color: #7d8b99; }
  body.dark .bubble.typing span  { background: #5c7186; }

  body.dark .photo-link          { background: rgba(255, 255, 255, .06); }
  body.dark .photo-fallback      { background: rgba(255, 255, 255, .06); }
  body.dark .album-cell          { background: rgba(255, 255, 255, .06); }

  /* 新增组件：搜索 / 引用 / 回应 / 菜单 */
  body.dark mark.hit            { background: #b8860b; color: #fff6d8; }
  body.dark mark.hit.current    { background: var(--c-accent); color: #fff; }

  body.dark .msg-actions,
  body.dark .ctx-menu,
  body.dark .reaction-picker    { background: #1c2733; border-color: #0f171e; }

  body.dark .ma-btn:hover,
  body.dark .ctx-menu button:hover,
  body.dark .reaction-picker button:hover,
  body.dark .ms-nav:hover:not(:disabled),
  body.dark .reply-bar .rb-close:hover { background: #2b3744; }

  body.dark .quote              { background: rgba(255, 255, 255, .07); }
  body.dark .quote:hover        { background: rgba(255, 255, 255, .13); }
  @keyframes quotePulseDark {
    0%, 100% { background: rgba(255, 255, 255, .07); }
    30%, 70% { background: rgba(51, 144, 236, .35); }
  }
  body.dark .quote.highlight    { animation-name: quotePulseDark; }
  body.dark .quote .q-text      { color: #8b98a5; }

  body.dark .reaction           { background: rgba(51, 144, 236, .2); }
  body.dark .reaction.mine      { background: rgba(51, 144, 236, .38); border-color: rgba(114, 176, 240, .6); }

  body.dark .composer .icon-btn  { color: #8b98a5; }
  body.dark .composer .icon-btn.active { background: #2b3744; color: var(--c-accent); }
  body.dark .input-wrap:focus-within   { background: #2b3848; }
  body.dark .emoji-btn:hover,
  body.dark .emoji-btn.active    { color: var(--c-accent); background: #2b3744; }

  body.dark .emoji-panel         { background: #1c2733; box-shadow: 0 14px 40px rgba(0, 0, 0, .6); }
  body.dark .emoji-panel button:hover { background: #2b3744; }

  /* ================= 个人信息面板 ================= */
  .profile-mask {
    position: fixed;
    inset: 0;
    background: rgba(8, 16, 24, .45);
    backdrop-filter: blur(2px);
    display: none;
    z-index: 500;
  }
  .profile-mask.open { display: block; animation: fadeIn var(--dur-slow) var(--ease); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .profile-panel {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: min(360px, 88vw);
    background: var(--bg-side);
    display: flex;
    flex-direction: column;
    box-shadow: 8px 0 40px rgba(5, 20, 35, .35);
    animation: slideIn .26s var(--ease);
    overflow: hidden;
  }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: none; } }

  .profile-cover {
    position: relative;
    flex: 0 0 auto;
    padding: 16px 18px 18px;
    background: linear-gradient(135deg, #6ea8dc, #3f7fc4 55%, #33557f);
    color: #fff;
  }
  .profile-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: rgba(255, 255, 255, .9);
    transition: background var(--dur-base) var(--ease);
  }
  .profile-close:hover { background: rgba(255, 255, 255, .18); }

  .profile-avatar {
    width: 84px; height: 84px;
    border-radius: 50%;
    position: relative;
    display: grid; place-items: center;
    overflow: hidden;
    background: linear-gradient(135deg, var(--avatar-c1), var(--avatar-c2));
    color: #fff;
    font-size: 30px;
    font-weight: 600;
    border: 3px solid rgba(255, 255, 255, .85);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    margin-bottom: 12px;
    user-select: none;
  }
  .profile-avatar .avatar-img { object-position: center 22%; }

  .profile-name {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.25;
    word-break: break-word;
  }
  .profile-sub {
    font-size: 13.5px;
    color: rgba(255, 255, 255, .82);
    margin-top: 3px;
  }

  .profile-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 0 18px;
  }
  .profile-section {
    padding: 10px 18px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--tx-faint);
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    font-size: 14.5px;
    color: var(--tx-main);
    transition: background var(--dur-fast) var(--ease);
    width: 100%;
    text-align: left;
    text-decoration: none;
  }
  .profile-row:hover { background: var(--bg-item-hover); }
  .profile-row .pr-icon {
    width: 22px;
    flex: 0 0 22px;
    display: grid;
    place-items: center;
    color: var(--tx-muted);
  }
  .profile-row .pr-label { flex: 1; min-width: 0; }
  .profile-row .pr-value {
    font-size: 13.5px;
    color: var(--tx-faint);
    flex: 0 0 auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .profile-hr {
    height: 1px;
    background: var(--bd-line);
    margin: 8px 18px;
    border: 0;
  }

  /* 聊天背景选择器 */
  .bg-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 6px 18px 16px;
  }
  .bg-swatch {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease);
    background-size: cover;
    background-position: center;
    padding: 0;
  }
  .bg-swatch:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .bg-swatch:active { transform: scale(.96); }
  .bg-swatch[aria-checked="true"] {
    border-color: var(--c-accent);
    box-shadow: 0 0 0 3px rgba(51,144,236,.22);
  }
  /* 选中打勾 */
  .bg-swatch[aria-checked="true"]::after {
    content: '✓';
    position: absolute;
    right: 4px; top: 4px;
    width: 17px; height: 17px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--c-accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .bg-swatch-name {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 3px 2px 4px;
    font-size: 10px;
    text-align: center;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
  }
  .bg-swatch-pat {
    position: absolute;
    inset: 0;
    background-repeat: repeat;
    pointer-events: none;
    z-index: 1;
  }

  /* 移动端：全宽面板 */
  @media (max-width: 820px) {
    .profile-panel { width: 100%; }
  }

  /* ================= 消息内搜索 ================= */
  .msg-search {
    position: absolute;
    top: 60px; right: 0; left: 0;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 9px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--bd-line);
    z-index: 25;
  }
  .msg-search.open { display: flex; animation: dropIn .2s var(--ease); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .msg-search .ms-field {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-fill);
    border-radius: var(--radius-pill);
    height: 40px;
    padding: 0 14px;
    color: var(--tx-faint);
    transition: box-shadow var(--dur-base) var(--ease), background var(--dur-base) var(--ease);
  }
  .msg-search .ms-field:focus-within {
    background: var(--bg-app);
    box-shadow: 0 0 0 2px var(--c-accent) inset;
    color: var(--c-accent);
  }
  .msg-search input {
    flex: 1; min-width: 0;
    border: 0; outline: 0;
    background: transparent;
    font-size: 14.5px;
    color: var(--tx-main);
  }
  .msg-search input::placeholder { color: var(--tx-faint); }
  .ms-count {
    font-size: 13px;
    color: var(--tx-faint);
    white-space: nowrap;
    min-width: 54px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ms-nav {
    width: 34px; height: 34px;
    flex: 0 0 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--tx-muted);
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .ms-nav:hover:not(:disabled) { background: var(--bg-fill); color: var(--c-accent); }
  .ms-nav:disabled { opacity: .35; cursor: default; }

  mark.hit {
    background: #ffe066;
    color: #4a3b00;
    border-radius: 3px;
    padding: 0 1px;
  }
  mark.hit.current { background: var(--c-accent); color: #fff; }

  .msg.flash .bubble { animation: flashRing 1.1s var(--ease); }
  @keyframes flashRing {
    0%, 100% { box-shadow: var(--bub-shadow); }
    25%, 75% { box-shadow: 0 0 0 3px rgba(51, 144, 236, .65); }
  }

  /* ================= 引用回复 ================= */
  .msg { position: relative; }
  .msg-actions {
    position: absolute;
    top: -15px;
    display: none;
    gap: 2px;
    padding: 3px;
    background: var(--bg-app);
    border: 1px solid var(--bd-line);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(10, 30, 50, .18);
    z-index: 12;
  }
  .msg:hover .msg-actions { display: flex; }
  .msg.in  .msg-actions { left: 8px; }
  .msg.out .msg-actions { right: 8px; }

  .ma-btn {
    width: 30px; height: 30px;
    border-radius: 7px;
    display: grid; place-items: center;
    font-size: 15px;
    color: var(--tx-muted);
    transition: background var(--dur-fast) var(--ease);
  }
  .ma-btn:hover { background: var(--bg-fill); }

  .reply-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    background: var(--bg-header);
    border-top: 1px solid var(--bd-line);
  }
  .reply-bar.open { display: flex; animation: dropIn .18s var(--ease); }
  .reply-bar .rb-line {
    width: 3px;
    align-self: stretch;
    border-radius: 2px;
    background: var(--c-accent);
    flex: 0 0 3px;
  }
  .reply-bar .rb-main { flex: 1; min-width: 0; }
  .reply-bar .rb-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--c-accent);
    line-height: 1.3;
  }
  .reply-bar .rb-text {
    font-size: 13px;
    color: var(--tx-muted);
    line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .reply-bar .rb-close {
    width: 32px; height: 32px;
    flex: 0 0 32px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--tx-muted);
    transition: background var(--dur-base) var(--ease);
  }
  .reply-bar .rb-close:hover { background: var(--bg-fill); }

  .quote {
    display: block;
    margin-bottom: 5px;
    padding: 4px 8px 4px 7px;
    border-left: 3px solid var(--c-accent);
    border-radius: 4px;
    background: rgba(0, 0, 0, .045);
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: background var(--dur-base) var(--ease);
  }
  .quote:hover { background: rgba(0, 0, 0, .085); }
  .quote.highlight { animation: quotePulse 1.2s var(--ease); }
  @keyframes quotePulse {
    0%, 100% { background: rgba(0, 0, 0, .045); }
    30%, 70% { background: rgba(51, 144, 236, .22); }
  }
  .quote .q-name {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--c-accent);
    line-height: 1.35;
  }
  .quote .q-text {
    display: block;
    font-size: 13px;
    color: var(--tx-muted);
    line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ================= 表情回应 ================= */
  .reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
  }
  .reaction {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(51, 144, 236, .13);
    border: 1px solid transparent;
    font-size: 13px;
    line-height: 1.5;
    color: var(--c-accent);
    font-weight: 500;
    transition: transform var(--dur-fast) var(--ease), background var(--dur-base) var(--ease);
  }
  .reaction:hover { transform: scale(1.06); }
  .reaction.mine { background: rgba(51, 144, 236, .26); border-color: rgba(51, 144, 236, .5); }
  .reaction:active { transform: scale(.94); }
  .reaction .r-count { font-size: 12px; }

  .reaction-picker {
    position: absolute;
    display: none;
    gap: 2px;
    padding: 5px;
    background: var(--bg-app);
    border: 1px solid var(--bd-line);
    border-radius: 22px;
    box-shadow: 0 6px 20px rgba(10, 30, 50, .22);
    z-index: 60;
  }
  .reaction-picker.open { display: flex; animation: popIn .16s var(--ease); }
  @keyframes popIn { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }
  .reaction-picker button {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px;
    transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .reaction-picker button:hover { background: var(--bg-fill); transform: scale(1.14); }

  /* ================= 图片灯箱 ================= */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    background: rgba(6, 12, 20, .93);
    backdrop-filter: blur(3px);
  }
  .lightbox.open { display: block; animation: fadeIn var(--dur-slow) var(--ease); }

  .lb-stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 56px 68px;
  }
  .lb-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    animation: lbIn .22s var(--ease);
  }
  @keyframes lbIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  .lb-btn {
    position: absolute;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    color: #fff;
    display: grid; place-items: center;
    transition: background var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
  }
  .lb-btn:hover { background: rgba(255, 255, 255, .24); }
  .lb-btn:disabled { opacity: .25; cursor: default; }
  .lb-close { top: 16px; right: 16px; }
  .lb-prev  { left: 16px;  top: 50%; transform: translateY(-50%); }
  .lb-next  { right: 16px; top: 50%; transform: translateY(-50%); }

  .lb-caption {
    position: absolute;
    left: 0; right: 0; bottom: 18px;
    text-align: center;
    color: rgba(255, 255, 255, .9);
    font-size: 13.5px;
    padding: 0 24px;
    pointer-events: none;
  }
  .lb-counter {
    display: inline-block;
    margin-top: 6px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, .6);
  }

  /* ================= 消息右键菜单 ================= */
  .ctx-menu {
    position: absolute;
    display: none;
    min-width: 172px;
    padding: 5px;
    background: var(--bg-app);
    border: 1px solid var(--bd-line);
    border-radius: 11px;
    box-shadow: 0 10px 32px rgba(10, 30, 50, .26);
    z-index: 700;
  }
  .ctx-menu.open { display: block; animation: popIn .14s var(--ease); }
  .ctx-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 14px;
    color: var(--tx-main);
    text-align: left;
    transition: background var(--dur-fast) var(--ease);
  }
  .ctx-menu button:hover { background: var(--bg-fill); }
  .ctx-menu button.danger { color: #d9534f; }
  .ctx-menu button.danger:hover { background: rgba(217, 83, 79, .1); }
  .ctx-menu .cm-icon { width: 18px; text-align: center; flex: 0 0 18px; }
  .ctx-hr { height: 1px; background: var(--bd-line); margin: 4px 6px; border: 0; }

  /* ================= 置顶消息条 ================= */
  .pinned-bar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 14px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--bd-line);
    cursor: pointer;
    transition: background var(--dur-base) var(--ease);
  }
  .pinned-bar:hover { background: var(--bg-fill); }
  .pinned-bar .pb-icon { font-size: 14px; flex: 0 0 auto; }
  .pinned-bar .pb-text {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--tx-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pinned-bar .pb-close {
    width: 26px; height: 26px;
    flex: 0 0 26px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px;
    color: var(--tx-faint);
    transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  .pinned-bar .pb-close:hover { background: var(--bg-fill); color: var(--tx-main); }

  /* ================= 会话置顶 / 免打扰 ================= */
  .chat-item .ci-flags {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
    font-size: 12px;
    line-height: 1;
  }
  .chat-item .ci-mute { font-size: 12px; opacity: .75; }
  .chat-item.active .ci-mute { filter: brightness(3); }
  .chat-item .ci-pin { font-size: 11px; color: var(--tx-faint); }
  .chat-item.active .ci-pin { color: rgba(255, 255, 255, .8); }
  .chat-item.muted .badge { background: var(--tx-faint); }
  .chat-item.active.muted .badge { background: #fff; color: var(--tx-faint); }


  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ================= 细节打磨 ================= */
  /* 选中文字使用品牌色，避免默认蓝与主题冲突 */
  ::selection { background: rgba(51, 144, 236, .28); }
  body.dark ::selection { background: rgba(51, 144, 236, .45); }

  /* 长链接与长文件名断行，避免撑破气泡 */
  .link-url, .file-name { overflow-wrap: anywhere; }
  .bubble .text { overflow-wrap: anywhere; }

  /* 触屏设备隐藏仅悬浮可见的操作条，避免留下不可点击的残影 */
  @media (hover: none) {
    .msg:hover .msg-actions { display: none; }
  }

  /* 高对比度 / 强制颜色模式下保证边框可见 */
  @media (forced-colors: active) {
    .bubble, .chat-item, .badge, .reaction { border: 1px solid CanvasText; }
    :focus-visible { outline: 2px solid Highlight; }
  }

  /* 打印时去掉外层投影与深色底，只保留内容 */
  @media print {
    body { background: #fff; padding: 0; }
    .app { box-shadow: none; height: auto; width: 100%; }
    .sidebar, .composer-wrap, .scroll-bottom, .chat-bg { display: none !important; }
    .chat-body { overflow: visible; height: auto; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" aria-label="会话列表">
    <div class="sidebar-head">
      <button class="icon-btn" id="menuBtn" type="button" title="菜单" aria-label="主菜单">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索" autocomplete="off"
               aria-label="搜索会话">
      </div>
    </div>
    <div class="cat-bar" id="catBar" role="tablist"
         aria-label="会话分类"></div>
    <div class="chat-list scroll-thin" id="chatList" role="listbox" aria-label="会话"></div>
  </aside>

  <!-- ==================== 聊天区 ==================== -->
  <main class="chat">

    <!-- 背景层：绝对定位于聊天区，不随消息滚动，保证渐变上下一致 -->
    <div class="chat-bg" id="chatBg" aria-hidden="true"></div>

    <header class="chat-header">
      <button class="icon-btn back" id="backBtn" type="button" title="返回" aria-label="返回会话列表">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="avatar" id="peerAvatar" aria-hidden="true">满</div>

      <div class="peer">
        <div class="peer-name" id="peerName">林小满</div>
        <div class="peer-status" id="peerStatus">在线</div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="searchMsgBtn" type="button" title="搜索消息" aria-label="搜索消息">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="callBtn" type="button" title="通话" aria-label="发起通话">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <path d="M6.6 3h2.6l1.6 4-2 1.4a12 12 0 0 0 6.8 6.8l1.4-2 4 1.6v2.6c0 1-.8 1.7-1.8 1.6C11.3 18.5 5.5 12.7 5 4.8 4.9 3.8 5.6 3 6.6 3Z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="moreBtn" type="button" title="更多" aria-label="更多选项">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <circle cx="12" cy="5"  r="1.9" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
            <circle cx="12" cy="19" r="1.9" fill="currentColor"/>
          </svg>
        </button>
        <button class="icon-btn theme-btn" type="button" title="切换主题" aria-label="切换日间夜间模式">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 消息内搜索栏 -->
    <div class="msg-search" id="msgSearchBar" role="search">
      <div class="ms-field">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="msgSearchInput" placeholder="在聊天记录中搜索" autocomplete="off"
               aria-label="在聊天记录中搜索">
      </div>
      <span class="ms-count" id="msgSearchCount" aria-live="polite">0/0</span>
      <button class="ms-nav" id="msPrevBtn" type="button" title="上一条" aria-label="上一条结果" disabled>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M7 14l5-5 5 5" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="ms-nav" id="msNextBtn" type="button" title="下一条" aria-label="下一条结果" disabled>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="ms-nav" id="msCloseBtn" type="button" title="关闭" aria-label="关闭搜索">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="chat-body scroll-thin" id="chatBody" role="log" aria-live="polite" aria-label="聊天记录">
      <button class="scroll-bottom" id="scrollBottomBtn" type="button" title="回到底部" aria-label="回到底部">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
          <path d="M6 10l6 6 6-6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <footer class="composer-wrap">
      <div class="reply-bar" id="replyBar">
        <span class="rb-line" aria-hidden="true"></span>
        <span class="rb-main">
          <span class="rb-title" id="replyTitle">回复</span>
          <span class="rb-text" id="replyPreview"></span>
        </span>
        <button class="rb-close" id="replyClose" type="button" title="取消回复" aria-label="取消回复">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="composer">
      <input type="file" id="fileInput" multiple hidden>

      <button class="icon-btn" id="attachBtn" type="button" title="上传文件" aria-label="上传文件">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M20 11.5 12.6 19a5 5 0 0 1-7.1-7.1l7.6-7.6a3.4 3.4 0 0 1 4.8 4.8l-7.5 7.5a1.8 1.8 0 0 1-2.5-2.5l6.8-6.8"
                fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="input-wrap">
        <input type="text" id="msgInput" placeholder="消息或链接" autocomplete="off"
               aria-label="输入消息">
        <button class="emoji-btn" id="emojiBtn" type="button" title="表情" aria-label="选择表情"
                aria-expanded="false" aria-controls="emojiPanel">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="9"  cy="10" r="1.2" fill="currentColor"/>
            <circle cx="15" cy="10" r="1.2" fill="currentColor"/>
            <path d="M8 14.2a5 5 0 0 0 8 0" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <button class="send-btn" id="sendBtn" type="button" title="发送" aria-label="发送消息">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
          <path d="M21.3 3.2 2.9 10.4c-1 .4-1 1.8.1 2.1l4.6 1.4 1.7 5.3c.3 1 1.6 1.1 2.1.2l2.4-4.2 4.7 3.4c.8.6 2 .1 2.2-.9l2.5-12.6c.2-1-.9-1.8-1.9-1.3Z"
                fill="currentColor"/>
        </svg>
      </button>

      <div class="emoji-panel" id="emojiPanel" role="group" aria-label="表情面板"></div>
      </div>
    </footer>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ==================== 图片灯箱 ==================== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片查看">
  <div class="lb-stage">
    <img class="lb-img" id="lbImg" alt="">
  </div>
  <button class="lb-btn lb-close" id="lbClose" type="button" title="关闭" aria-label="关闭">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" title="上一张" aria-label="上一张">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="lb-btn lb-next" id="lbNext" type="button" title="下一张" aria-label="下一张">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<!-- ==================== 消息右键菜单 ==================== -->
<div class="ctx-menu" id="ctxMenu" role="menu"></div>

<!-- ==================== 表情选择器 ==================== -->
<div class="reaction-picker" id="reactionPicker" role="group" aria-label="选择表情回应"></div>

<!-- ==================== 个人信息面板 ==================== -->
<div class="profile-mask" id="profileMask">
  <aside class="profile-panel" id="profilePanel" role="dialog" aria-modal="true" aria-labelledby="profileName">
    <div class="profile-cover">
      <button class="profile-close" id="profileClose" type="button" title="关闭" aria-label="关闭个人信息">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="profile-avatar" id="profileAvatar" aria-hidden="true">满</div>
      <div class="profile-name" id="profileName">林小满</div>
      <div class="profile-sub" id="profileStatus">在线</div>
    </div>

    <div class="profile-body">
      <div class="profile-section">账号信息</div>
      <div class="profile-row">
        <span class="pr-icon" aria-hidden="true">🆔</span>
        <span class="pr-label">用户名</span>
        <span class="pr-value" id="prUsername">—</span>
      </div>
      <div class="profile-row">
        <span class="pr-icon" aria-hidden="true">📞</span>
        <span class="pr-label">手机号</span>
        <span class="pr-value" id="prPhone">—</span>
      </div>
      <div class="profile-row">
        <span class="pr-icon" aria-hidden="true">🔗</span>
        <span class="pr-label">个性签名</span>
        <span class="pr-value" id="prBio">—</span>
      </div>

      <hr class="profile-hr">

      <div class="profile-section">聊天背景</div>
      <div class="bg-picker" id="bgPicker" role="radiogroup" aria-label="聊天背景"></div>

      <hr class="profile-hr">

      <div class="profile-section">设置</div>
      <button class="profile-row" id="prTheme" type="button">
        <span class="pr-icon" aria-hidden="true">🌙</span>
        <span class="pr-label">夜间模式</span>
        <span class="pr-value" id="prThemeState">关闭</span>
      </button>
      <button class="profile-row" id="prClear" type="button">
        <span class="pr-icon" aria-hidden="true">🧹</span>
        <span class="pr-label">清空当前聊天记录</span>
      </button>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 数据
     ========================================================= */
  /* Telegram 官方默认涂鸦图案（birds / cats / pineapple / balloon / dino / sheep …）
     由官方 745 条矢量 path 栅格化为 1-bit PNG：低透明度下与矢量视觉无差别，

  /* 构造一个「图片 + 失败降级」的链接单元，供 image / album 复用。
     container 用于承载降级块（默认就是链接自身）。 */
  function buildPhoto(url, alt, cellCls) {
    const link = el('a', 'photo-link' + (cellCls ? ' ' + cellCls : ''));
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.title = (alt || '图片') + ' · 点击查看原图';

    const img = el('img', 'photo-img loading');
    img.src = url;
    img.alt = alt || '图片';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';

    img.addEventListener('load', function () {
      img.classList.remove('loading');
      img.classList.add('loaded');   // 解除 4:3 占位，改用真实比例
      // 图集里：按图片真实比例决定格子走向，竖图不被压扁
      if (cellCls && cellCls.indexOf('album-cell') !== -1 && img.naturalWidth && img.naturalHeight) {
        link.classList.toggle('portrait', img.naturalHeight > img.naturalWidth);
      }
      /* 仅当本次渲染的意图是「贴底」时才回到底部。
         切群时意图是顶部（nearBottomBeforeImage=false），
         这里绝不能滚动，否则图片陆续加载会把视点一路拽到底部。 */
      if (nearBottomBeforeImage && !chatPinnedToTop) {
        scrollToBottom(false);
        nearBottomBeforeImage = false;
      }
    }, { once: true });

    img.addEventListener('error', function () {
      const fb = el('span', 'photo-fallback');
      fb.appendChild(el('span', 'pf-icon', '🖼️'));
      fb.appendChild(el('span', 'pf-text', alt || '图片加载失败'));
      fb.insertAdjacentHTML('beforeend',
        '<span class="pf-text" style="opacity:.7">点击在新窗口打开</span>');
      if (img.parentNode === link) link.replaceChild(fb, img);
      // 加载失败时不再拦截点击，让链接照常在新窗口打开
      link.dataset.fallback = '1';
      // 失败也需解除贴底等待，否则后续图片加载会误触发一次贴底滚动
      nearBottomBeforeImage = false;
    }, { once: true });

    /* 点击图片 → 打开灯箱看大图（不再直接跳新窗口） */
    link.addEventListener('click', function (e) {
      if (link.dataset.fallback) return;   // 失效图仍走原始链接
      e.preventDefault();
      const list = collectChatImages();
      let start = -1;
      for (let i = 0; i < list.length; i++) { if (list[i].url === url) { start = i; break; } }
      if (start < 0) { list.push({ url: url, alt: alt }); start = list.length - 1; }
      openLightbox(list, start);
    });

    link.appendChild(img);
    return link;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

    const d = new Date();

  function formatSize(bytes) {
    if (!bytes) return '0 B';
    const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
    return (bytes / Math.pow(k, i)).toFixed(i === 0 ? 0 : 1) + ' ' + sizes[i];
  }

  function extOf(name) {
    const i = (name || '').lastIndexOf('.');
    return i === -1 ? '' : name.slice(i + 1).toLowerCase();
  }

  /* 填充头像：有 avatar 字段就叠加图片，加载失败自动退回首字母。
     node 需已包含首字母文本。
     防重入：快速切换会话时会被连续调用，用令牌作废前一次的回调，
     避免旧图 load/error 回调操作已被移除的节点。 */
  function fillAvatar(node, chat) {
    node.style.setProperty('--avatar-c1', chat.c1);
    node.style.setProperty('--avatar-c2', chat.c2);

    // 作废上一轮尚未返回的回调
    const token = (Number(node.dataset.avatarToken) || 0) + 1;
    node.dataset.avatarToken = String(token);

    // 切换会话时清掉上一次可能残留的图片/失败态
    const old = node.querySelector('.avatar-img');
    if (old) old.remove();
    node.classList.remove('load-failed');

    if (!chat.avatar) {
      node.textContent = chat.char;
      node.classList.remove('has-photo');
      return;
    }

    node.textContent = chat.char;   // 图片加载前的兜底
    node.classList.add('has-photo');

    const img = el('img', 'avatar-img');
    img.src = chat.avatar;
    img.alt = chat.name + ' 的头像';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';

    img.addEventListener('load', function () {
      if (node.dataset.avatarToken !== String(token)) return;   // 已被后续调用取代
      node.classList.remove('load-failed');
    }, { once: true });
    img.addEventListener('error', function () {
      if (node.dataset.avatarToken !== String(token)) return;
      // 图挂了：移除图片，露出首字母底色
      if (img.parentNode === node) node.removeChild(img);
      node.classList.remove('has-photo');
      node.classList.add('load-failed');
    }, { once: true });

    node.appendChild(img);
  }

  function fileIcon(name) {
    const ext = extOf(name);
    for (let i = 0; i < EXT_ICONS.length; i++) {
      if (EXT_ICONS[i][0].indexOf(ext) !== -1) return EXT_ICONS[i][1];
    }
    return '📎';
  }

  /* 简易防抖：搜索输入等高频事件使用 */
  function debounce(fn, wait) {
    let t;
    return function () {
      const args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }

  /* 统一的内部元素滚动：只滚动容器，避免整页/父级跳动。
     不依赖 Element.scrollTo（老版本 Safari 不支持），优先用 CSS 平滑，
     降级时直接赋值 scrollTop。 */
  function scrollToBottom(smooth) {
    const reduce = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 主动贴底即视为放弃「锁定顶部」
    chatPinnedToTop = false;

    if (smooth && !reduce && typeof chatBody.scrollTo === 'function') {
      chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
    } else {
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }

  function isNearBottom() {
    return chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight < 60;
  }

  function getActive() {
    return chats.find(function (c) { return c.id === activeId; }) || chats[0];
  }

  /* 安全存储：隐私模式 / 禁用存储时不抛错 */
  const store = {
    get: function (k) {
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ }
    },
    del: function (k) {
      try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
    }
  };

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* =========================================================
     4. 消息渲染
     ========================================================= */
  function fillWave(waveEl) {
    const frag = document.createDocumentFragment();
    const bars = 30;
    for (let i = 0; i < bars; i++) {
      const b = document.createElement('i');
      const h = 18 + Math.abs(Math.sin(i * 0.85)) * 78;
      b.style.height = h.toFixed(1) + '%';
      b.style.opacity = (0.55 + Math.abs(Math.cos(i * 0.5)) * 0.45).toFixed(2);
      b.style.animationDelay = (i * 0.045).toFixed(2) + 's';
      frag.appendChild(b);
    }
    waveEl.appendChild(frag);
  }

  /* 单勾（已发送）/ 双勾（已读）回执 */
  const TICK_SINGLE =
    '<svg class="ticks" viewBox="0 0 12 11" width="12" height="10" aria-hidden="true">' +
      '<path d="M1.5 5.8 4.5 9 10 1.6" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function appendMeta(bubble, m) {
    const meta = el('span', 'meta');
    meta.appendChild(el('span', 'time', m.time));
    if (m.dir === 'out') {
      const read = m.read !== false && m.read !== 0;
      meta.insertAdjacentHTML('beforeend', read ? TICKS : TICK_SINGLE);
    }
    bubble.appendChild(meta);
  }

  /* 引用块：显示被引用消息的缩略，点击可跳到原消息 */
  function buildQuote(m) {
    const q = m.replyTo;
    if (!q) return null;

    const box = el('button', 'quote');
    box.type = 'button';
    const who = q.dir === 'out' ? '我' : (getActive().name || '对方');
    box.appendChild(el('span', 'q-name', who));
    box.appendChild(el('span', 'q-text', quoteTextOf(q)));
    box.title = '跳到原消息';
    box.dataset.quoteId = String(q.id);
    box.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      jumpToMessage(q.id);
    });
    return box;
  }

  function quoteTextOf(q) {
    if (q.type === 'text')  return q.text || '';
    if (q.type === 'file')  return '📎 ' + (q.name || '文件');
    if (q.type === 'image') return '🖼️ 图片';
    if (q.type === 'album') return '🖼️ ' + ((q.images && q.images.length) || 0) + ' 张图片';
    if (q.type === 'voice') return '🎤 语音消息';
    if (q.type === 'link')  return '🔗 ' + (q.title || q.url || '链接');
    return '';
  }

  /* 表情回应条 */
  function buildReactions(m) {
    if (!m.reactions || !Object.keys(m.reactions).length) return null;

    const wrap = el('div', 'reactions');
    Object.keys(m.reactions).forEach(function (emoji) {
      const r = m.reactions[emoji];
      const btn = el('button', 'reaction' + (r.mine ? ' mine' : ''));
      btn.type = 'button';
      btn.appendChild(el('span', 'r-emoji', emoji));
      btn.appendChild(el('span', 'r-count', String(r.count)));
      btn.title = r.mine ? '取消回应' : '添加回应';
      btn.setAttribute('aria-label', emoji + ' ' + r.count + ' 个回应');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleReaction(m, emoji);
      });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  /* 消息悬浮操作条 */
  function buildActions(m) {
    const bar = el('div', 'msg-actions');

    const reactBtn = el('button', 'ma-btn');
    reactBtn.type = 'button';
    reactBtn.textContent = '😊';
    reactBtn.title = '表情回应';
    reactBtn.setAttribute('aria-label', '表情回应');
    reactBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      openReactionPicker(m, reactBtn);
    });
    bar.appendChild(reactBtn);

    const replyBtn = el('button', 'ma-btn');
    replyBtn.type = 'button';
    replyBtn.textContent = '↩';
    replyBtn.title = '回复';
    replyBtn.setAttribute('aria-label', '回复此消息');
    replyBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      startReply(m);
    });
    bar.appendChild(replyBtn);

    return bar;
  }

  function buildMessage(m, animate, index) {
    /* ---- 日期分隔 ---- */
    if (m.type === 'date') {
      const d = el('div', 'date-divider');
      d.appendChild(el('span', null, m.text));
      return d;
    }

    const row    = el('div', 'msg ' + m.dir + (animate ? ' anim' : ''));
    const bubble = el('div', 'bubble');

    if (typeof index === 'number') {
      row.dataset.msgIndex = String(index);
      m.id = index;   // 供引用跳转定位
    }

    /* ---- 引用块（所有类型通用，插在最前） ---- */
    const quote = buildQuote(m);
    if (quote) bubble.appendChild(quote);

    /* ---- 文本 ---- */
    if (m.type === 'text') {
      if (m.dir === 'in' && m.sender) bubble.appendChild(el('span', 'sender', m.sender));
      bubble.appendChild(el('span', 'text', m.text));

    /* ---- 文件 ---- */
    } else if (m.type === 'file') {
      bubble.classList.add('file');

      const card = el('div', 'file-card');
      card.appendChild(el('div', 'file-icon', fileIcon(m.name)));
      const info = el('div', 'file-info');
      info.appendChild(el('div', 'file-name', m.name));
      if (m.size) info.appendChild(el('div', 'file-size', m.size));
      card.appendChild(info);

      if (m.url) {
        const a = el('a', 'file-link');
        a.href = m.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = '打开：' + m.url;
        a.appendChild(card);
        bubble.appendChild(a);
      } else {
        bubble.appendChild(card);
      }

    /* ---- 链接 ---- */
    } else if (m.type === 'link') {
      bubble.classList.add('link');
      const a = el('a', 'link-card');
      a.href = m.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      if (m.dir === 'in' && m.sender) a.appendChild(el('div', 'sender', m.sender));
      a.appendChild(el('div', 'link-title', m.title || m.url));
      a.appendChild(el('div', 'link-url', m.url));
      if (m.desc) a.appendChild(el('div', 'link-preview', m.desc));
      bubble.appendChild(a);

    /* ---- 单张图片 ---- */
    } else if (m.type === 'image') {
      bubble.classList.add('photo');
      bubble.appendChild(buildPhoto(m.url, m.alt, null));

    /* ---- 图集（一条消息多图） ---- */
    } else if (m.type === 'album') {
      bubble.classList.add('album');

      const images = Array.isArray(m.images) ? m.images : [];
      const grid = el('div', 'album-grid');
      grid.dataset.count = String(Math.min(images.length, 2));
      if (images.length === 2) grid.classList.add('ratio-auto');

      images.forEach(function (item) {
        grid.appendChild(buildPhoto(item.url, item.alt, 'album-cell'));
      });
      bubble.appendChild(grid);

      if (m.caption) {
        const cap = el('div', 'album-caption', m.caption);
        bubble.appendChild(cap);
      }

    /* ---- 语音 ---- */
    } else if (m.type === 'voice') {
      bubble.classList.add('voice');

      const btn = el('button', 'voice-play');
      btn.type = 'button';
      btn.innerHTML = ICON_PLAY;
      btn.title = '播放语音';
      btn.setAttribute('aria-label', '播放语音');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const playing = bubble.classList.toggle('playing');
        btn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
        btn.title = playing ? '暂停' : '播放语音';
        btn.setAttribute('aria-label', playing ? '暂停播放' : '播放语音');
      });
      bubble.appendChild(btn);

      const wave = el('div', 'voice-wave');
      fillWave(wave);
      bubble.appendChild(wave);
      bubble.appendChild(el('span', 'voice-dur', m.dur || ''));
    }

    appendMeta(bubble, m);
    row.appendChild(bubble);

    const reactions = buildReactions(m);
    if (reactions) row.appendChild(reactions);

    /* 非删除类消息才挂操作条 */
    row.appendChild(buildActions(m));
    return row;
  }

  function createTypingRow() {
    const row = el('div', 'msg in typing-row');
    const b = el('div', 'bubble typing');
    b.setAttribute('aria-label', '对方正在输入');
    b.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(b);
    return row;
  }

  /* 渲染当前会话消息。
     align: 'top'    = 定位到最上面（切换会话时的默认行为）
            'bottom' = 定位到最下面（发送消息 / 清空后等场景）
            false   = 保持当前位置不滚动 */
  function renderMessages(align) {
    const chat = getActive();
    const frag = document.createDocumentFragment();

    /* 先确定本次渲染的锚定意图，再做任何 DOM 操作：
       - nearBottomBeforeImage: 仅贴底时，图片加载完才需要回底
       - chatPinnedToTop:       锁定顶部，禁止任何回调滚动视点
       必须在 buildMessage 之前设置，因为构建过程会挂上图片 load 回调。 */
    nearBottomBeforeImage = (align === 'bottom');
    chatPinnedToTop = (align === 'top');

    /* 冻结平滑滚动：整列 DOM 重建后浏览器会重算滚动锚点，
       若此时还开着 scroll-behavior:smooth，视觉上就是「一路滑到底部」。 */
    const freeze = (align === 'top');
    if (freeze) chatBody.style.scrollBehavior = 'auto';

    chat.messages.forEach(function (m, i) { frag.appendChild(buildMessage(m, false, i)); });
    if (chat.typing) frag.appendChild(createTypingRow());

    chatBody.innerHTML = '';
    chatBody.appendChild(frag);
    chatBody.appendChild(scrollBottomBtn);   // 悬浮按钮始终保留在容器内

    if (align === 'top') {
      chatBody.scrollTop = 0;                // 直接赋值，必定瞬时
    } else if (align !== false) {
      scrollToBottom(false);
    } else {
      chatBody.scrollTop = 0;
    }
    clearMsgSearchUi();

    /* 连续两帧把视点钉在顶部：首帧完成布局，次帧压过图片解码引起的重排。
       之后才恢复 CSS 的平滑滚动。 */
    if (freeze) {
      requestAnimationFrame(function () {
        chatBody.scrollTop = 0;
        requestAnimationFrame(function () {
          chatBody.scrollTop = 0;
          chatBody.style.scrollBehavior = '';
        });
      });
    }
  }

  /* 滚到会话最顶部：切换会话时从这里开始阅读。
     注意：.chat-body 上有 CSS `scroll-behavior: smooth`，而 scrollTo 的
     behavior:'auto' 是「沿用 CSS 设置」的意思，仍然会平滑动画 —— 表现为
     切进群后画面一路滑到底部。这里必须显式覆盖为 instant 才能真正跳到顶部。 */
  function scrollToTop() {
    try {
      chatBody.scrollTo({ top: 0, behavior: 'instant' });
    } catch (e) {
      chatBody.scrollTop = 0;   // 老浏览器不支持 instant 选项时兜底
    }
    // 顶部时不需要「回到底部」按钮
    scrollBottomBtn.classList.toggle('show', !isNearBottom());
  }

  function appendMessage(m) {
    const oldTyping = chatBody.querySelector('.typing-row');
    if (oldTyping) oldTyping.remove();

    const chat = getActive();
    const stick = isNearBottom();
    chatBody.insertBefore(buildMessage(m, true, chat.messages.length - 1), scrollBottomBtn);

    if (chat.typing) chatBody.insertBefore(createTypingRow(), scrollBottomBtn);
    if (stick) scrollToBottom(true);
  }

  /* 只重绘一条消息（回应/回执变化时用，避免整列重建） */
  function refreshMessage(index) {
    const row = chatBody.querySelector('.msg[data-msg-index="' + index + '"]');
    if (!row) return;
    const m = getActive().messages[index];
    if (!m) return;
    const fresh = buildMessage(m, false, index);
    row.parentNode.replaceChild(fresh, row);
  }

  /* =========================================================
     5. 侧边栏渲染
     ========================================================= */
  function previewOf(chat) {
    const list = chat.messages.filter(function (m) { return m.type !== 'date'; });
    const last = list[list.length - 1];
    if (!last) return '暂无消息';
    if (last.type === 'text')  return last.text;
    if (last.type === 'file')  return '📎 ' + last.name;
    if (last.type === 'image') return '🖼️ 图片' + (last.caption ? ' · ' + last.caption : '');
    if (last.type === 'album') {
      const n = Array.isArray(last.images) ? last.images.length : 0;
      return '🖼️ ' + n + ' 张图片' + (last.caption ? ' · ' + last.caption : '');
    }
    if (last.type === 'voice') return '🎤 语音消息 · ' + last.dur;
    if (last.type === 'link') {
      // 分类群：预览显示「共 N 个站点」，比最后一条 URL 更有信息量
      if (chat.isCatGroup && chat.sites) {
        return '🔗 ' + chat.sites.length + ' 个站点';
      }
      return '🔗 ' + last.url;
    }
    return '';
  }

  function buildChatItem(chat) {
    const item = el('div', 'chat-item'
      + (chat.id === activeId ? ' active' : '')
      + (chat.muted ? ' muted' : ''));
    item.dataset.id = chat.id;
    item.setAttribute('role', 'option');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-selected', String(chat.id === activeId));

    const av = el('div', 'avatar', chat.char);
    fillAvatar(av, chat);
    item.appendChild(av);

    const main = el('div', 'ci-main');

    const top = el('div', 'ci-top');
    top.appendChild(el('span', 'ci-name', chat.name));

    // 时间右侧：静音图标 + 置顶图标
    const flags = el('span', 'ci-flags');
    if (chat.muted) flags.appendChild(el('span', 'ci-mute', '🔕'));
    if (chat.pinned) flags.appendChild(el('span', 'ci-pin', '📌'));
    top.appendChild(flags);
    top.appendChild(el('span', 'ci-time', chat.time));
    main.appendChild(top);

    const bottom = el('div', 'ci-bottom');
    bottom.appendChild(el('span', 'ci-msg', previewOf(chat)));
    if (chat.unread > 0) {
      const b = el('span', 'badge', chat.unread > 99 ? '99+' : String(chat.unread));
      b.setAttribute('aria-label', '未读 ' + chat.unread + ' 条' + (chat.muted ? '（免打扰）' : ''));
      bottom.appendChild(b);
    }
    main.appendChild(bottom);

    item.appendChild(main);
    return item;
  }

  /* 右键会话：置顶 / 免打扰 */
  chatListEl.addEventListener('contextmenu', function (e) {
    const item = e.target.closest('.chat-item');
    if (!item || !item.dataset.id) return;
    e.preventDefault();
    const chat = chats.find(function (c) { return c.id === item.dataset.id; });
    if (!chat) return;

    ctxMenu.innerHTML = '';
    function add(label, icon, fn) {
      const b = el('button');
      b.type = 'button';
      b.setAttribute('role', 'menuitem');
      b.appendChild(el('span', 'cm-icon', icon));
      b.appendChild(el('span', null, label));
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        closeCtxMenu();
        fn();
      });
      ctxMenu.appendChild(b);
    }
    add(chat.pinned ? '取消置顶' : '置顶会话', '📌', function () { togglePinChat(chat); });
    add(chat.muted ? '关闭免打扰' : '开启免打扰', '🔕', function () { toggleMuteChat(chat); });
    add(chat.unread > 0 ? '标记为已读' : '标记为未读', '✉️', function () {
      chat.unread = chat.unread > 0 ? 0 : 1;
      renderChatList(searchInput.value);
      persist();
    });

    ctxMenu.classList.add('open');
    const w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
    let left = e.clientX, top = e.clientY;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
    ctxMenu.style.left = Math.max(8, left) + 'px';
    ctxMenu.style.top  = Math.max(8, top) + 'px';
  });

  /* 会话是否命中搜索词：除了会话名，也匹配会话内消息内容。
     分类群里有数百个站点，只比对会话名会让「原神」「淘宝」等搜不到。 */
  function chatMatches(chat, q) {
    if (!q) return true;
    if (chat.name.toLowerCase().indexOf(q) !== -1) return true;
    if (chat.status && chat.status.toLowerCase().indexOf(q) !== -1) return true;
    const list = chat.messages;
    for (let i = 0; i < list.length; i++) {
      if (searchableText(list[i]).toLowerCase().indexOf(q) !== -1) return true;
    }
    return false;
  }

  function renderChatList(filter) {
    const q = (filter || '').trim().toLowerCase();
    const frag = document.createDocumentFragment();
    let shown = 0;

    // 置顶的会话排在前面（稳定排序，其余保持原顺序）
    const ordered = chats.slice().sort(function (a, b) {
      return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    });

    ordered.forEach(function (chat) {
      if (!chatMatches(chat, q)) return;
      frag.appendChild(buildChatItem(chat));
      shown++;
    });

    chatListEl.innerHTML = '';
    if (shown === 0) {
      chatListEl.appendChild(el('div', 'empty-tip',
        q ? '没有找到与「' + (filter || '').trim() + '」相关的会话' : '暂无会话'));
    } else {
      chatListEl.appendChild(frag);
    }
  }

  /* ---- 分类快捷栏：点击直接跳到对应的分类群（不隐藏其他会话） ---- */
  function buildCatBar() {
    const bar = $('catBar');
    if (!bar) return;
    const counts = countByCat();
    const frag = document.createDocumentFragment();

    SITE_CATS.forEach(function (cat) {
      const chip = el('button', 'cat-chip');
      chip.type = 'button';
      chip.dataset.cat = cat;
      chip.textContent = cat;
      const n = counts[cat] || 0;
      if (n) chip.appendChild(el('span', 'cat-n', String(n)));
      frag.appendChild(chip);
    });

    bar.textContent = '';
    bar.appendChild(frag);

    bar.addEventListener('click', function (e) {
      const chip = e.target.closest ? e.target.closest('.cat-chip') : null;
      if (!chip || !chip.dataset.cat) return;
      jumpToCat(chip.dataset.cat);

  /* 跳到某个分类群：清掉筛选、滚动到该项并高亮 */
  function jumpToCat(cat) {
    // 分类栏的跳转不应被搜索词挡住
    if (searchInput.value) { searchInput.value = ''; }
    renderChatList('');
    const target = chatListEl.querySelector('.chat-item[data-id="cat-' + cat + '"]');
    if (target && target.scrollIntoView) {
      target.scrollIntoView({ block: 'start', behavior: 'smooth' });

  /* 事件委托：整个列表只挂一个监听 */
  chatListEl.addEventListener('click', function (e) {
    const item = e.target.closest('.chat-item');
    if (item && item.dataset.id) selectChat(item.dataset.id);

  chatListEl.addEventListener('keydown', function (e) {

  /* =========================================================
     6. 切换会话
     ========================================================= */
  function updateHeader() {

    peerStatus.classList.toggle('offline', !c.online);

  function selectChat(id) {
    appEl.classList.remove('show-sidebar');   // 移动端：回到聊天区
    clearAutoReplyTimers();
    cancelReply();
    userNavigated = true;   // 用户已手动切换会话，首屏贴底逻辑不再接管

    if (id === activeId) {
