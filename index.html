  /* =========================================================
     7. 发送消息
     ========================================================= */
  function sendMessage() {
    const value = msgInput.value.trim();
    if (!value) { msgInput.focus(); return; }

    const chat = getActive();
    const time = nowTime();
    let m;

    if (URL_RE.test(value)) {
      m = {
        type: 'link', dir: 'out', url: value,
        title: value.replace(/^https?:\/\//, '').split('/')[0],
        desc: '点击打开链接',
        time: time
      };
    } else {
      m = { type: 'text', dir: 'out', text: value, time: time };
    }

    // 带引用
    if (replyTarget) {
      m.replyTo = replyTarget;
      cancelReply();
    }

    m.read = false;   // 新发出的消息先是单勾
    chat.messages.push(m);
    chat.time = time;
    msgInput.value = '';

    appendMessage(m);
    renderChatList(searchInput.value);
    msgInput.focus();
    persist();

    // 触发对方的自动回复（仅在与真人会话时）
    if (chat.id !== 'telegram') scheduleAutoReply(chat, value);
  }

  /* =========================================================
     12. 个人信息面板
     ========================================================= */
  /* 焦点陷阱：模态面板声明了 aria-modal="true"，但没有陷阱时
     键盘用户按 Tab 会跑到面板背后的内容上。这里把 Tab 循环限制在面板内。 */
  function trapFocus(container, e) {
    if (e.key !== 'Tab') return;
    const sel = 'a[href], button:not([disabled]), input:not([disabled]), ' +
                'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const items = Array.prototype.filter.call(
      container.querySelectorAll(sel),
      function (n) { return n.offsetWidth > 0 || n.offsetHeight > 0 || n === document.activeElement; }
    );
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }

  function openProfile() {
    fillAvatar(profileAvatar, ME);
    profileName.textContent   = ME.name;
    profileStatus.textContent = ME.status;
    prUsername.textContent    = ME.username;

    prBio.textContent         = ME.bio;
    syncProfileTheme();

    lastFocused = document.activeElement;
    profileMask.classList.add('open');
    // 打开后把焦点移入面板，便于键盘操作与 Esc 关闭
    const closeBtn = $('profileClose');
    if (closeBtn) closeBtn.focus();
  }

  function closeProfile() {
    if (!profileMask.classList.contains('open')) return;
    profileMask.classList.remove('open');
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    lastFocused = null;
  }

  function syncProfileTheme() {
    const dark = document.body.classList.contains('dark');
    prThemeState.textContent = dark ? '开启' : '关闭';
    const icon = $('prTheme').querySelector('.pr-icon');
    if (icon) icon.textContent = dark ? '☀️' : '🌙';
  }

  /* =========================================================
     12b. 聊天背景（Telegram 经典配色 + 官方涂鸦图案）
     ========================================================= */
  let bgId = 'classic';        // 当前实际生效的配色
  let bgUserChoice = null;     // 用户明确选择的配色（夜间自动降级前的原值）

  function getBg(id) {
    for (let i = 0; i < CHAT_BACKGROUNDS.length; i++) {
      if (CHAT_BACKGROUNDS[i].id === id) return CHAT_BACKGROUNDS[i];
    }
    return CHAT_BACKGROUNDS[0];
  }

  /* 把选中配色写进 CSS 变量：三个渐变端点 + 图案着色方式 */
  function applyBackground(id, isUserPick) {
    const bg = getBg(id);
    bgId = bg.id;
    if (isUserPick) bgUserChoice = bg.id;

    const root = document.documentElement.style;
    root.setProperty('--chat-c1', bg.c1);
    root.setProperty('--chat-c2', bg.c2);
    root.setProperty('--chat-c3', bg.c3);

    if (bg.ink === 'none') {
      root.setProperty('--chat-pattern', 'none');
    } else {
      root.setProperty('--chat-pattern', PATTERN_URI);
      root.setProperty('--chat-pat-size', '420px auto');
      // 原稿是深色描边：深色底(ink:dark) 直接用；浅色底(ink:light) 用 screen 混色变白
      root.setProperty('--chat-pat-blend', bg.ink === 'light' ? 'screen' : 'normal');
      root.setProperty('--chat-pat-opacity', bg.ink === 'light' ? '.16' : '.07');
    }
    syncBgPicker();
  }

  /* 夜间模式下若用浅色背景，气泡与文字对比会明显下降。
     切主题时自动协调：夜间避开浅色底，回到日间恢复用户的选择。 */
  const DARK_BG_FALLBACK = 'night';
  function reconcileBackgroundWithTheme() {
    const isDark = document.body.classList.contains('dark');
    const cur = getBg(bgId);
    if (isDark && cur.ink === 'light') {
      applyBackground(DARK_BG_FALLBACK, false);
    } else if (!isDark && bgId === DARK_BG_FALLBACK && bgUserChoice) {
      applyBackground(bgUserChoice, false);
    }
  }

  function syncBgPicker() {
    const picker = $('bgPicker');
    if (!picker) return;
    Array.prototype.forEach.call(picker.children, function (btn) {
      btn.setAttribute('aria-checked', String(btn.dataset.bg === bgId));
    });
  }

  function buildBgPicker() {
    const picker = $('bgPicker');
    if (!picker) return;
    const frag = document.createDocumentFragment();

    CHAT_BACKGROUNDS.forEach(function (bg) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bg-swatch';
      btn.dataset.bg = bg.id;
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', String(bg.id === bgId));
      btn.title = bg.name;
      btn.style.backgroundImage =
        'linear-gradient(160deg,' + bg.c1 + ' 0%,' + bg.c2 + ' 45%,' + bg.c3 + ' 100%)';

      // 图案用内层伪元素感的 span 叠加，保证配色块上能看到涂鸦
      if (bg.ink !== 'none') {
        const pat = document.createElement('span');
        pat.className = 'bg-swatch-pat';
        pat.style.backgroundImage = PATTERN_URI;
        pat.style.backgroundSize = '120px auto';
        pat.style.opacity = bg.ink === 'light' ? '.2' : '.1';
        pat.style.mixBlendMode = bg.ink === 'light' ? 'screen' : 'normal';
        btn.appendChild(pat);
      }

      const nm = document.createElement('span');
      nm.className = 'bg-swatch-name';
      nm.textContent = bg.name;
      btn.appendChild(nm);
      frag.appendChild(btn);
    });

    picker.textContent = '';
    picker.appendChild(frag);

    picker.addEventListener('click', function (e) {
      const btn = e.target.closest ? e.target.closest('.bg-swatch') : null;
      if (!btn || !btn.dataset.bg) return;
      applyBackground(btn.dataset.bg, true);
      store.set('tg-chat-bg', bgUserChoice);
      // 浅色底 + 夜间主题会看不清气泡，顺手提醒并给出建议
      const chosen = getBg(bgId);
      const isDark = document.body.classList.contains('dark');
      if (isDark && chosen.ink === 'light') {
        showToast('夜间模式下已暂用「夜空」背景 · 白天会自动回到「' + getBg(bgUserChoice).name + '」🌙');
      } else {
        showToast('已切换聊天背景 · ' + chosen.name + ' 🎨');
      }
    });
  }

  $('profileClose').addEventListener('click', closeProfile);

  // 点击遮罩（面板外部）关闭
  profileMask.addEventListener('click', function (e) {
    if (e.target === profileMask) closeProfile();
  });

  $('prTheme').addEventListener('click', function () {
    const next = document.body.classList.contains('dark') ? 'light' : 'dark';
    store.set('tg-theme', next);
    applyTheme(next);
    syncProfileTheme();
    showToast(next === 'dark' ? '已切换到夜间模式 🌙' : '已切换到日间模式 ☀️');
  });

  $('prClear').addEventListener('click', function () {
    const chat = getActive();
    const kept = chat.messages.filter(function (m) { return m.type === 'date'; });
    chat.messages = kept;
    renderMessages('top');   // 清空后回到顶部
    renderChatList(searchInput.value);
    persist();
    showToast('已清空「' + chat.name + '」的聊天记录');
  });

  /* =========================================================
     13. 消息内搜索
     ========================================================= */
  let searchHits = [];      // 命中的消息索引（升序）
  let searchCursor = -1;    // 当前停留第几处（对应 searchHits 下标）

  function clearMsgSearchUi() {
    searchHits = [];
    searchCursor = -1;
    if (msgSearchCount) msgSearchCount.textContent = '0/0';
    if (msPrevBtn) msPrevBtn.disabled = true;
    if (msNextBtn) msNextBtn.disabled = true;
  }

  function searchableText(m) {
    if (m.type === 'date') return '';
    if (m.type === 'text') return m.text || '';
    if (m.type === 'file') return (m.name || '') + ' ' + (m.size || '');
    if (m.type === 'link') return (m.title || '') + ' ' + (m.url || '') + ' ' + (m.desc || '');
    if (m.type === 'image') return (m.alt || '') + ' ' + (m.caption || '');
    if (m.type === 'album') {
      const caps = (m.images || []).map(function (i) { return i.alt || ''; }).join(' ');
      return (m.caption || '') + ' ' + caps;
    }
    if (m.type === 'voice') return m.dur || '';
    return '';
  }

  /* 把命中的关键词包成 <mark class="hit">，只处理文本节点，避免破坏结构 */
  function highlightIn(root, term, hitCounter) {
    /* 空词保护：indexOf('') 恒为 0 且 from 不前进，会造成死循环 */
    if (!root || !term || !term.length) return;

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const targets = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.toLowerCase().indexOf(term) !== -1) {
        targets.push(node);
      }
    }
    targets.forEach(function (textNode) {
      const value = textNode.nodeValue;
      const lower = value.toLowerCase();
      const frag = document.createDocumentFragment();
      let from = 0, at;
      while ((at = lower.indexOf(term, from)) !== -1) {
        if (at > from) frag.appendChild(document.createTextNode(value.slice(from, at)));
        const mark = document.createElement('mark');
        mark.className = 'hit';
        mark.textContent = value.slice(at, at + term.length);
        hitCounter.n++;
        frag.appendChild(mark);
        from = at + term.length;
      }
      if (from < value.length) frag.appendChild(document.createTextNode(value.slice(from)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  function runMsgSearch(term) {
    clearMsgSearchUi();
    const q = (term || '').trim().toLowerCase();
    if (!q) return;

    const chat = getActive();
    const frag = document.createDocumentFragment();
    nearBottomBeforeImage = false;

    // 重新渲染（清掉上一次的 mark），并在渲染中打标
    const hitCounter = { n: 0 };
    chat.messages.forEach(function (m, i) {
      const row = buildMessage(m, false, i);
      if (m.type !== 'date' && searchableText(m).toLowerCase().indexOf(q) !== -1) {
        searchHits.push(i);
      }
      frag.appendChild(row);
    });
    if (chat.typing) frag.appendChild(createTypingRow());

    chatBody.innerHTML = '';
    chatBody.appendChild(frag);
    chatBody.appendChild(scrollBottomBtn);

    // 在 DOM 上做高亮（仅文本类消息，避免污染属性）
    chatBody.querySelectorAll('.msg .text, .msg .link-title, .msg .link-url, .msg .link-preview, .msg .file-name, .msg .file-size, .msg .album-caption, .quote .q-text').forEach(function (node) {
      highlightIn(node, q, hitCounter);
    });

    msgSearchCount.textContent = searchHits.length ? ('0/' + searchHits.length) : '0/0';
    const has = searchHits.length > 0;
    msPrevBtn.disabled = !has;
    msNextBtn.disabled = !has;

    if (has) gotoHit(0);
  }

  function gotoHit(pos) {
    if (!searchHits.length) return;
    searchCursor = (pos + searchHits.length) % searchHits.length;
    const msgIndex = searchHits[searchCursor];

    // 高亮当前所在的 mark
    chatBody.querySelectorAll('mark.hit.current').forEach(function (mk) { mk.classList.remove('current'); });
    const marks = chatBody.querySelectorAll('.msg[data-msg-index="' + msgIndex + '"] mark.hit');
    if (marks.length) marks[0].classList.add('current');

    // 滚动到该消息
    const row = chatBody.querySelector('.msg[data-msg-index="' + msgIndex + '"]');
    if (row) {
      const top = row.offsetTop - chatBody.clientHeight / 2 + row.offsetHeight / 2;
      if (typeof chatBody.scrollTo === 'function') {
        chatBody.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      } else {
        chatBody.scrollTop = Math.max(0, top);
      }
      row.classList.add('flash');
      setTimeout(function () { row.classList.remove('flash'); }, 1150);
    }

    msgSearchCount.textContent = (searchCursor + 1) + '/' + searchHits.length;
  }

  const applyMsgSearch = debounce(function () { runMsgSearch(msgSearchInput.value); }, 140);

  function openMsgSearch() {
    msgSearchBar.classList.add('open');
    msgSearchInput.focus();
    msgSearchInput.select();
  }

  function closeMsgSearch() {
    // 搜索栏本来就没开时直接返回：否则会额外触发一次整列重建 + 滚动，
    // 把手动定位（例如切会话停在顶部）冲掉。
    if (!msgSearchBar.classList.contains('open')) return;
    msgSearchBar.classList.remove('open');
    msgSearchInput.value = '';
    clearMsgSearchUi();
    renderMessages('bottom');   // 关闭搜索后回到最新消息
  }

  msgSearchInput.addEventListener('input', applyMsgSearch);
  msgSearchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      gotoHit(searchCursor + (e.shiftKey ? -1 : 1));
    }
  });
  msPrevBtn.addEventListener('click', function () { gotoHit(searchCursor - 1); });
  msNextBtn.addEventListener('click', function () { gotoHit(searchCursor + 1); });
  msCloseBtn.addEventListener('click', closeMsgSearch);

  /* =========================================================
     14. 引用回复
     ========================================================= */
  let replyTarget = null;   // { id, dir, type, ... } 被引用消息的快照

  function snapshotForQuote(m) {
    return {
      id: m.id,
      dir: m.dir,
      type: m.type,
      text: m.text,
      name: m.name,
      url: m.url,
      title: m.title,
      dur: m.dur,
      alt: m.alt,
      images: m.images
    };
  }

  function startReply(m) {
    replyTarget = snapshotForQuote(m);
    const who = m.dir === 'out' ? '我' : (getActive().name || '对方');
    replyTitle.textContent = '回复 ' + who;
    replyPreview.textContent = quoteTextOf(replyTarget);
    replyBar.classList.add('open');
    msgInput.focus();
  }

  function cancelReply() {
    replyTarget = null;
    replyBar.classList.remove('open');
  }

  replyClose.addEventListener('click', cancelReply);

  /* 点击引用块跳到原消息 */
  function jumpToMessage(id) {
    if (id == null) return;
    const row = chatBody.querySelector('.msg[data-msg-index="' + id + '"]');
    if (!row) { showToast('原消息已被删除'); return; }
    const top = row.offsetTop - chatBody.clientHeight / 2 + row.offsetHeight / 2;
    if (typeof chatBody.scrollTo === 'function') {
      chatBody.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    } else {
      chatBody.scrollTop = Math.max(0, top);
    }
    row.classList.add('flash');
    setTimeout(function () { row.classList.remove('flash'); }, 1150);
  }

  /* =========================================================
     15. 表情回应
     ========================================================= */
  function toggleReaction(m, emoji) {
    if (!m.reactions) m.reactions = {};
    const cur = m.reactions[emoji];
    if (!cur) {
      m.reactions[emoji] = { count: 1, mine: true };
    } else if (cur.mine) {
      cur.count -= 1;
      cur.mine = false;
      if (cur.count <= 0) delete m.reactions[emoji];
    } else {
      cur.count += 1;
      cur.mine = true;
    }
    if (m.id != null) refreshMessage(m.id);
    persist();
  }

  function openReactionPicker(m, anchor) {
    reactionPicker.innerHTML = '';
    QUICK_REACTIONS.forEach(function (emoji) {
      const b = el('button', null, emoji);
      b.type = 'button';
      b.setAttribute('aria-label', '回应 ' + emoji);
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleReaction(m, emoji);
        closeReactionPicker();
      });
      reactionPicker.appendChild(b);
    });

    // 定位到气泡上方
    const rect = anchor.getBoundingClientRect();
    reactionPicker.classList.add('open');
    const pw = reactionPicker.offsetWidth || 250;
    const ph = reactionPicker.offsetHeight || 46;
    let left = rect.left + window.scrollX - pw / 2 + rect.width / 2;
    let top  = rect.top + window.scrollY - ph - 8;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    top  = Math.max(8, top);
    reactionPicker.style.left = left + 'px';
    reactionPicker.style.top  = top + 'px';

    reactionPicker._target = m;
  }

  function closeReactionPicker() {
    reactionPicker.classList.remove('open');
    reactionPicker._target = null;
  }

  /* 双击气泡快速贴 👍 */
  chatBody.addEventListener('dblclick', function (e) {
    const row = e.target.closest('.msg');
    if (!row || row.classList.contains('typing-row')) return;
    if (e.target.closest('a, button')) return;
    const idx = row.dataset.msgIndex;
    if (idx == null) return;
    const m = getActive().messages[+idx];
    if (!m) return;
    toggleReaction(m, '👍');
  });

  /* =========================================================
     16. 图片灯箱
     ========================================================= */
  let lbList = [];
  let lbIndex = 0;
  let lbLastFocus = null;

  /* 收集当前会话里所有可看的图片，用于灯箱左右翻页 */
  function collectChatImages() {
    const out = [];
    getActive().messages.forEach(function (m) {
      if (m.type === 'image' && m.url) {
        out.push({ url: m.url, alt: m.alt || m.caption || '图片' });
      } else if (m.type === 'album' && Array.isArray(m.images)) {
        m.images.forEach(function (it) {
          if (it && it.url) out.push({ url: it.url, alt: it.alt || m.caption || '图片' });
        });
      }
    });
    return out;
  }

  function openLightbox(list, start) {
    lbList = list || [];
    lbIndex = Math.max(0, Math.min(start || 0, lbList.length - 1));
    if (!lbList.length) return;
    lbLastFocus = document.activeElement;
    lightbox.classList.add('open');
    renderLightbox();
    lbClose.focus();
  }

  function renderLightbox() {
    const item = lbList[lbIndex];
    if (!item) return;
    lbImg.src = item.url;
    lbImg.alt = item.alt || '图片';
    lbCaption.textContent = '';
    if (item.alt) lbCaption.appendChild(document.createTextNode(item.alt));
    if (lbList.length > 1) {
      const counter = el('span', 'lb-counter', (lbIndex + 1) + ' / ' + lbList.length);
      lbCaption.appendChild(document.createElement('br'));
      lbCaption.appendChild(counter);
    }
    const single = lbList.length <= 1;
    lbPrev.disabled = single;
    lbNext.disabled = single;
  }

  function closeLightbox() {
    if (!lightbox.classList.contains('open')) return;
    lightbox.classList.remove('open');
    lbImg.removeAttribute('src');
    if (lbLastFocus && typeof lbLastFocus.focus === 'function') lbLastFocus.focus();
    lbLastFocus = null;
  }

  function lbStep(delta) {
    if (lbList.length <= 1) return;
    lbIndex = (lbIndex + delta + lbList.length) % lbList.length;
    renderLightbox();
  }

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', function (e) { e.stopPropagation(); lbStep(-1); });
  lbNext.addEventListener('click', function (e) { e.stopPropagation(); lbStep(1); });
  lightbox.addEventListener('click', function (e) {
    // 点击图片以外的深色区域关闭
    if (e.target === lightbox || e.target.classList.contains('lb-stage')) closeLightbox();
  });

  /* =========================================================
     17. 消息右键菜单
     ========================================================= */
  let ctxTargetIndex = null;

  function buildCtxMenu(m, index) {
    ctxMenu.innerHTML = '';

    function add(label, icon, fn, danger) {
      const b = el('button', danger ? 'danger' : null);
      b.type = 'button';
      b.setAttribute('role', 'menuitem');
      b.appendChild(el('span', 'cm-icon', icon));
      b.appendChild(el('span', null, label));
      b.addEventListener('click', function () {
        closeCtxMenu();
        fn();
      });
      ctxMenu.appendChild(b);
    }

    add('回复', '↩', function () { startReply(m); });
    add('复制文本', '📋', function () { copyMessage(m); });

    if (m.type !== 'date') {
      const hr = el('hr', 'ctx-hr');
      ctxMenu.appendChild(hr);
      add('转发到…', '➡️', function () { forwardMessage(m); });
    }

    if (m.type !== 'date') {
      add('置顶消息', '📌', function () {
        const chat = getActive();
        chat.pinnedMsg = (chat.pinnedMsg === index) ? null : index;
        showToast(chat.pinnedMsg === index ? '已置顶该消息' : '已取消置顶');
        updatePinnedBar();
        persist();
      });
    }

    ctxMenu.appendChild(el('hr', 'ctx-hr'));
    add('删除消息', '🗑️', function () { deleteMessage(index); }, true);
  }

  function copyMessage(m) {
    const text = m.type === 'text' ? (m.text || '')
      : m.type === 'link' ? (m.url || '')
      : m.type === 'file' ? (m.name || '')
      : m.type === 'image' || m.type === 'album' ? (m.caption || (m.images && m.images[0] && m.images[0].url) || '')
      : quoteTextOf(m);
    if (!text) { showToast('这条消息没有可复制的文本'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制到剪贴板');
      }, function () {
        showToast('复制失败，请手动选择');
      });
    } else {
      showToast('当前环境不支持自动复制');
    }
  }

  function forwardMessage(m) {
    const others = chats.filter(function (c) { return c.id !== activeId; });
    if (!others.length) { showToast('没有其他会话可转发'); return; }

    // 简易转发：按顺序转发到下一个会话
    const target = others[0];
    const copy = JSON.parse(JSON.stringify(snapshotForQuote(m)));
    copy.dir = 'out';
    copy.time = nowTime();
    copy.fwdFrom = getActive().name;
    delete copy.id;
    copy.type = m.type;
    if (m.type === 'image' || m.type === 'album') {
      copy.images = m.images;
      copy.url = m.url;
      copy.alt = m.alt;
      copy.caption = m.caption;
    }
    target.messages.push(copy);
    target.time = copy.time;
    renderChatList(searchInput.value);
    persist();
    showToast('已转发到「' + target.name + '」');
  }

  function deleteMessage(index) {
    const chat = getActive();
    if (index == null || !chat.messages[index]) return;
    chat.messages.splice(index, 1);
    // 索引会变，重置消息置顶
    chat.pinnedMsg = null;
    renderMessages('bottom');   // 删除后回到最新消息处
    renderChatList(searchInput.value);
    updatePinnedBar();
    persist();
    showToast('已删除该消息');
  }

  function closeCtxMenu() {
    ctxMenu.classList.remove('open');
    ctxTargetIndex = null;
  }

  function openCtxMenu(x, y, m, index) {
    ctxTargetIndex = index;
    buildCtxMenu(m, index);
    ctxMenu.classList.add('open');
    // 先显示再量尺寸，避免越界
    const w = ctxMenu.offsetWidth;
    const h = ctxMenu.offsetHeight;
    let left = x, top = y;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
    ctxMenu.style.left = Math.max(8, left) + 'px';
    ctxMenu.style.top  = Math.max(8, top) + 'px';
  }

  chatBody.addEventListener('contextmenu', function (e) {
    const row = e.target.closest('.msg');
    if (!row || row.classList.contains('typing-row')) return;
    const idx = row.dataset.msgIndex;
    if (idx == null) return;
    const m = getActive().messages[+idx];
    if (!m) return;
    e.preventDefault();
    openCtxMenu(e.clientX, e.clientY, m, +idx);
  });

  window.addEventListener('resize', closeCtxMenu);

  /* =========================================================
     18. 置顶消息条
     ========================================================= */
  function updatePinnedBar() {
    const chat = getActive();
    let bar = document.getElementById('pinnedBar');
    const idx = chat.pinnedMsg;

    if (idx == null || !chat.messages[idx]) {
      if (bar) bar.remove();
      return;
    }
    if (!bar) {
      bar = el('div', 'pinned-bar');
      bar.id = 'pinnedBar';
      chatBody.parentNode.insertBefore(bar, chatBody);
    }
    bar.innerHTML = '';
    const m = chat.messages[idx];
    bar.appendChild(el('span', 'pb-icon', '📌'));
    bar.appendChild(el('span', 'pb-text', quoteTextOf(m) || '已置顶的消息'));
    const close = el('button', 'pb-close', '✕');
    close.type = 'button';
    close.title = '取消置顶';
    close.setAttribute('aria-label', '取消置顶');
    close.addEventListener('click', function () {
      chat.pinnedMsg = null;
      updatePinnedBar();
      persist();
    });
    bar.appendChild(close);
    bar.addEventListener('click', function (e) {
      if (e.target === close) return;
      jumpToMessage(idx);
    });
  }

  /* =========================================================
     19. 自动回复 + 已读回执
     ========================================================= */
  let autoReplyTimers = [];

  function clearAutoReplyTimers() {
    autoReplyTimers.forEach(clearTimeout);
    autoReplyTimers = [];
  }

  function pickAutoReply(text) {
    for (let i = 0; i < AUTO_REPLIES.length; i++) {
      if (AUTO_REPLIES[i][0].test(text)) return AUTO_REPLIES[i][1];
    }
    return AUTO_FALLBACK[Math.floor(Math.random() * AUTO_FALLBACK.length)];
  }

  /* 对方回复流程：正在输入 → 追加消息 → 已读 */
  function scheduleAutoReply(chat, triggerText) {
    clearAutoReplyTimers();

    const t1 = setTimeout(function () {
      const row = createTypingRow();
      chatBody.insertBefore(row, scrollBottomBtn);
      if (isNearBottom()) scrollToBottom(true);

      const t2 = setTimeout(function () {
        const typing = chatBody.querySelector('.typing-row');
        if (typing) typing.remove();

        const reply = {
          type: 'text', dir: 'in',
          text: pickAutoReply(triggerText),
          time: nowTime()
        };
        chat.messages.push(reply);
        chat.time = reply.time;
        appendMessage(reply);
        renderChatList(searchInput.value);

        // 对方已读：把本会话发出的消息标为已读
        markOutgoingRead(chat);

        // 停留 4 秒后再移除输入气泡（这里已经移除）
        persist();
      }, 1100 + Math.random() * 900);

      autoReplyTimers.push(t2);
    }, 500 + Math.random() * 500);

    autoReplyTimers.push(t1);
  }

  function markOutgoingRead(chat) {
    let changed = false;
    chat.messages.forEach(function (m, i) {
      if (m.dir === 'out' && m.read !== true) {
        m.read = true;
        changed = true;
        if (m.id != null) refreshMessage(m.id);
      }
    });
    if (changed) persist();
  }

  /* =========================================================
     20. 会话置顶 / 免打扰
     ========================================================= */
  function togglePinChat(chat) {
    chat.pinned = !chat.pinned;
    renderChatList(searchInput.value);
    persist();
    showToast(chat.pinned ? '已置顶「' + chat.name + '」' : '已取消置顶');
  }

  function toggleMuteChat(chat) {
    chat.muted = !chat.muted;
    renderChatList(searchInput.value);
    persist();
    showToast(chat.muted ? '已开启「' + chat.name + '」的免打扰' : '已关闭免打扰');
  }

  /* =========================================================
     21. 回到底部
     ========================================================= */
  scrollBottomBtn.addEventListener('click', function () { scrollToBottom(true); });

  /* 滚动监听：isNearBottom() 会读取 scrollHeight/clientHeight 触发重排，
     直接挂在 scroll 上会在惯性滚动时每帧多次调用。用 rAF 合并到每帧一次。
     同时：用户一旦向下滚动，就解除「锁定顶部」，后续新消息/图片才能正常贴底。 */
  let scrollRaf = 0;
  chatBody.addEventListener('scroll', function () {
    // 用户手动滚动（滚轮/触摸/键盘）解除顶部锁定；程序性滚动不算
    if (chatPinnedToTop && chatBody.scrollTop > 8) chatPinnedToTop = false;

    if (scrollRaf) return;
    scrollRaf = (window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); })(function () {
      scrollRaf = 0;
      scrollBottomBtn.classList.toggle('show', !isNearBottom());
    });
  }, { passive: true });

  /* 明确的用户意图：滚轮 / 触摸拖动 / 方向键，直接解除顶部锁定 */
  ['wheel', 'touchmove', 'keydown'].forEach(function (t) {
    chatBody.addEventListener(t, function () { chatPinnedToTop = false; }, { passive: true });
  });

  /* =========================================================
     22. 主题切换
     ========================================================= */
  function applyTheme(theme) {
    const isDark = theme === 'dark';
    document.body.classList.toggle('dark', isDark);
    themeBtns.forEach(function (btn) {
      btn.innerHTML = isDark ? ICON_SUN : ICON_MOON;
      btn.title = isDark ? '切换到日间模式' : '切换到夜间模式';
      btn.setAttribute('aria-label', btn.title);
    });
    // 背景随主题协调：夜间自动避开浅色底，保证气泡可读
    if (typeof reconcileBackgroundWithTheme === 'function') reconcileBackgroundWithTheme();
  }

  function getTheme() {
    const saved = store.get('tg-theme');
    if (saved === 'dark' || saved === 'light') return saved;
    // 无存储偏好时跟随系统
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }

  themeBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark';
      store.set('tg-theme', next);
      applyTheme(next);
      showToast(next === 'dark' ? '已切换到夜间模式 🌙' : '已切换到日间模式 ☀️');
    });
  });

  /* =========================================================
     23. 本地持久化（会话状态）
     ========================================================= */
  /* v2：分类群改版后会话 id 语义变化（cat-* 取代 site-*），
     旧快照可能残留已废弃的站点会话消息，故换键让旧数据自然失效 */
  const STORAGE_KEY = 'tg-chat-state-v2';

  /* 持久化只排除「可再生的内容」：分类群（cat-*）的数百条站点卡片由
     SITE_CHATS 每次启动重新生成，落盘既无意义又占用配额。
     其余会话（含用户新增消息、已读/置顶/免打扰状态）照常保存，
     因此不会丢失任何用户改动。 */
  function persist() {
    try {
      const snapshot = {
        activeId: activeId,
        chats: chats.filter(function (c) {
          return !c.isCatGroup;   // 分类群可完全再生，不落盘
        }).map(function (c) {
          return {
            id: c.id,
            unread: c.unread,
            time: c.time,
            pinned: !!c.pinned,
            muted: !!c.muted,
            pinnedMsg: (typeof c.pinnedMsg === 'number') ? c.pinnedMsg : null,
            messages: c.messages
          };
        })
      };
      store.set(STORAGE_KEY, JSON.stringify(snapshot));
    } catch (e) { /* 存储不可用或超限，静默降级 */ }
  }

  /* 校验单条消息的最小可用结构：损坏数据若直接进入渲染会抛错，
     因此这里逐条过滤，只保留字段合法的消息。 */
  function isValidMessage(m) {
    if (!m || typeof m !== 'object') return false;
    const t = m.type;
    if (typeof t !== 'string') return false;
    if (t === 'date') return typeof m.text === 'string';
    if (m.dir !== 'in' && m.dir !== 'out') return false;
    if (t === 'text')  return typeof m.text === 'string';
    if (t === 'file')  return typeof m.name === 'string';
    if (t === 'link')  return typeof m.url === 'string' && m.url.length > 0;
    if (t === 'image') return typeof m.url === 'string' && m.url.length > 0;
    if (t === 'album') return Array.isArray(m.images) &&
      m.images.length > 0 &&
      m.images.every(function (i) { return i && typeof i.url === 'string' && i.url.length > 0; });
    if (t === 'voice') return true;
    return false;   // 未知类型一律丢弃，避免渲染分支落空
  }

  function sanitizeMessages(list) {
    return list.filter(isValidMessage);
  }

  function restore() {
    const raw = store.get(STORAGE_KEY);
    if (!raw) return;
    let data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    if (!data || !Array.isArray(data.chats)) return;

    const map = {};
    data.chats.forEach(function (saved) { if (saved && saved.id) map[saved.id] = saved; });

    chats.forEach(function (chat) {
      const saved = map[chat.id];
      if (!saved) return;
      // 快照里的消息必须先过结构校验，否则损坏数据会让 renderMessages 抛错并白屏
      if (Array.isArray(saved.messages)) {
        const clean = sanitizeMessages(saved.messages);
        // 只有解析出内容时才覆盖内置数据；空结果视为快照损坏，保留原始 demo 数据
        if (clean.length) chat.messages = clean;
      }
      if (typeof saved.unread === 'number' && saved.unread >= 0) chat.unread = saved.unread;
      if (typeof saved.time === 'string') chat.time = saved.time;
      chat.pinned = !!saved.pinned;
      chat.muted = !!saved.muted;
      chat.pinnedMsg = (typeof saved.pinnedMsg === 'number' &&
        saved.pinnedMsg >= 0 && saved.pinnedMsg < chat.messages.length) ? saved.pinnedMsg : null;
    });

    if (data.activeId && chats.some(function (c) { return c.id === data.activeId; })) {
      activeId = data.activeId;
    }
  }

  /* =========================================================
     24. 初始化
     ========================================================= */
  let activeId = chats[0].id;
  let nearBottomBeforeImage = false;
  /* 本次渲染是否「锁定在顶部」。切群后置 true，
     任何图片加载/布局回调都不得滚动视点，直到用户主动滚动。 */
  let chatPinnedToTop = false;

  restore();

  // 先定下用户的背景偏好，再应用主题（主题可能因夜间模式把浅色底换成深色底）
  bgUserChoice = store.get('tg-chat-bg') || 'classic';
  applyBackground(bgUserChoice, false);
  buildBgPicker();
  applyTheme(getTheme());
  applyBackground(bgId, false);
  updateHeader();
  buildCatBar();
  renderChatList('');
  renderMessages('bottom');   // 首屏落在最新消息
  updatePinnedBar();

  /* 窄屏（<=820px）下默认展示会话列表，而不是直接进聊天窗口。
     宽屏是双栏布局，会话列表本来就常驻，无需处理。 */
  const MOBILE_QUERY = '(max-width: 820px)';
  function isNarrow() {
    return window.matchMedia && window.matchMedia(MOBILE_QUERY).matches;
  }
  if (isNarrow()) appEl.classList.add('show-sidebar');

  /* 跨越断点时同步布局状态：
     - 进入窄屏：回到会话列表，避免"闪一下聊天窗口"
     - 回到宽屏：清掉类，恢复双栏 */
  if (window.matchMedia) {
    const mq = window.matchMedia(MOBILE_QUERY);
    const onMqChange = function (e) {
      if (e.matches) appEl.classList.add('show-sidebar');
      else appEl.classList.remove('show-sidebar');
    };
    if (mq.addEventListener) mq.addEventListener('change', onMqChange);
    else if (mq.addListener) mq.addListener(onMqChange);   // 旧版 Safari
  }

  /* 首屏图片加载完成后贴底，保证落在最新消息。
     但若用户在 load 之前已经手动切换过会话（此时定位意图是「顶部」），
     就不能再把视点抢回底部。 */
  let userNavigated = false;
  window.addEventListener('load', function () {
    if (userNavigated) return;
    scrollToBottom(false);
    scrollBottomBtn.classList.remove('show');
  }, { once: true });
})();
</script>
